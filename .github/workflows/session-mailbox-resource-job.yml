name: Session Mailbox Resource Job

on:
  push:
    branches:
      - main
    paths:
      - '.engine-session/**/request.json'

permissions:
  contents: write
  statuses: write

jobs:
  session-mailbox:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard and locate request
        run: |
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER" || exit 2
          case "$HEAD_MESSAGE" in 'session: open '*) ;; *) exit 2 ;; esac
          python - <<'PY' >> "$GITHUB_ENV"
          import hashlib, json, re, subprocess
          from pathlib import Path
          changed = subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'], text=True).splitlines()
          paths = [p for p in changed if re.fullmatch(r'\.engine-session/[A-Za-z0-9._-]{8,80}/request\.json', p)]
          if len(paths) != 1:
              raise SystemExit(f'exactly one request.json required: {paths}')
          path = Path(paths[0]); raw = path.read_bytes(); data = json.loads(raw)
          if data.get('version') != 1 or data.get('schema') != 'pdf-engine-session-request-v1':
              raise SystemExit('bad request schema')
          rid = data.get('request_id')
          if rid != path.parent.name:
              raise SystemExit('request id/path mismatch')
          key = data.get('return_public_key')
          pin = data.get('engine_commit')
          if not isinstance(key,str) or not re.fullmatch(r'[A-Za-z0-9_-]{40,60}', key):
              raise SystemExit('bad return public key')
          if not isinstance(pin,str) or not re.fullmatch(r'[0-9a-f]{40}', pin):
              raise SystemExit('bad engine pin')
          if subprocess.run(['git','merge-base','--is-ancestor',pin,'HEAD']).returncode:
              raise SystemExit('engine pin not ancestor')
          drift=[p for p in subprocess.check_output(['git','diff','--name-only',pin,'HEAD'],text=True).splitlines() if not p.startswith('.engine-session/')]
          if drift:
              raise SystemExit(f'engine code drift after pin: {drift}')
          print(f'REQUEST_ID={rid}')
          print(f'REQUEST_DIR={path.parent.as_posix()}')
          print(f'RETURN_PUBLIC_KEY={key}')
          print(f'ENGINE_CODE_COMMIT={pin}')
          print(f'REQUEST_SHA256={hashlib.sha256(raw).hexdigest()}')
          print(f'RESULT_BRANCH=session-result/{rid}')
          PY
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install engine and publish one-time receive key
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          pdf-session keygen --private-out /tmp/session-private.key --public-out /tmp/session-public.txt
          echo "SESSION_PUBLIC_KEY=$(cat /tmp/session-public.txt)"
          python - <<'PY'
          import json, os, urllib.request
          key=open('/tmp/session-public.txt',encoding='ascii').read().strip()
          req=urllib.request.Request(
            f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
            data=json.dumps({'state':'pending','context':'pdf-engine/session-key','description':f"key={key} request={os.environ['REQUEST_ID']}"[:140]}).encode(),
            headers={'Authorization':f"Bearer {os.environ['GITHUB_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},
            method='POST')
          urllib.request.urlopen(req).read()
          PY
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install document runtime
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends texlive-xetex texlive-lang-chinese texlive-latex-extra texlive-pictures texlive-science fonts-noto-cjk fonts-arphic-ukai fonts-arphic-uming fonts-wqy-zenhei poppler-utils fontconfig

      - name: Wait for encrypted payload
        run: |
          for _ in $(seq 1 180); do
            git fetch --quiet origin main
            ref=refs/remotes/origin/main
            current="$(git show "$ref:$REQUEST_DIR/request.json" | sha256sum | awk '{print $1}')"
            test "$current" = "$REQUEST_SHA256" || exit 2
            if git cat-file -e "$ref:$REQUEST_DIR/input.sealed.b64" 2>/dev/null &&
               git cat-file -e "$ref:$REQUEST_DIR/input.sha256" 2>/dev/null; then
              git show "$ref:$REQUEST_DIR/input.sealed.b64" | tr -d '\r\n ' | base64 -d > /tmp/input.sealed
              git show "$ref:$REQUEST_DIR/input.sha256" | tr -d '\r\n ' > /tmp/input.sha256
              echo "$(cat /tmp/input.sha256)  /tmp/input.sealed" | sha256sum -c -
              exit 0
            fi
            sleep 5
          done
          exit 2

      - name: Decrypt and validate package
        run: |
          pdf-session unseal --private-key "$(cat /tmp/session-private.key)" --request-id "$REQUEST_ID" --input /tmp/input.sealed --output /tmp/job.zip
          rm -rf /tmp/job /tmp/out && mkdir -p /tmp/job /tmp/out
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('/tmp/job').resolve()
          with zipfile.ZipFile('/tmp/job.zip') as z:
              for m in z.infolist():
                  t=(root/m.filename).resolve()
                  if root!=t and root not in t.parents:
                      raise SystemExit('zip path escape')
              z.extractall(root)
          PY
          python - <<'PY' >> "$GITHUB_ENV"
          from pathlib import Path
          import re,yaml
          d=yaml.safe_load(Path('/tmp/job/engine-run.yaml').read_text(encoding='utf-8')) or {}
          if d.get('version')!=1: raise SystemExit('bad engine-run version')
          job=d.get('job_file'); block=d.get('block_id'); dpi=int(d.get('dpi',144))
          if not isinstance(job,str) or not re.fullmatch(r'[A-Za-z0-9._-]+',job): raise SystemExit('bad job file')
          if not isinstance(block,str) or not re.fullmatch(r'[A-Za-z0-9._-]+',block): raise SystemExit('bad block id')
          if not 72<=dpi<=300: raise SystemExit('bad dpi')
          print(f'ENGINE_JOB_FILE={job}'); print(f'ENGINE_BLOCK_ID={block}'); print(f'ENGINE_DPI={dpi}')
          PY
          export ENGINE_JOB_FILE="$(python -c "import yaml; print((yaml.safe_load(open('/tmp/job/engine-run.yaml', encoding='utf-8')) or {})['job_file'])")"
          export ENGINE_BLOCK_ID="$(python -c "import yaml; print((yaml.safe_load(open('/tmp/job/engine-run.yaml', encoding='utf-8')) or {})['block_id'])")"
          export ENGINE_DPI="$(python -c "import yaml; print(int((yaml.safe_load(open('/tmp/job/engine-run.yaml', encoding='utf-8')) or {}).get('dpi', 144)))")"
          python - <<'PY'
          from pathlib import Path
          import os,yaml
          d=yaml.safe_load((Path('/tmp/job')/os.environ['ENGINE_JOB_FILE']).read_text(encoding='utf-8')) or {}
          if d.get('privacy')!='session': raise SystemExit('privacy must be session')
          blocks={b.get('block_id'):b for b in d.get('blocks',[]) if isinstance(b,dict)}
          b=blocks.get(os.environ['ENGINE_BLOCK_ID'])
          if not b: raise SystemExit('missing block')
          if b.get('kind') not in {'figure','chart','source-page','asset','composition','final-pdf'}:
              raise SystemExit('block kind outside engine mechanical boundary')
          PY
          pdf-resource-job "/tmp/job/$ENGINE_JOB_FILE"

      - name: Execute resource block
        id: execute_resource
        continue-on-error: true
        run: |
          pdf-resource-run --root /tmp/job --job "$ENGINE_JOB_FILE" --block "$ENGINE_BLOCK_ID" --out /tmp/out --dpi "$ENGINE_DPI"

      - name: Encrypt authorized result files only
        if: always()
        env:
          EXECUTION_OUTCOME_FOR_RETURN: ${{ steps.execute_resource.outcome }}
        run: |
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          import yaml

          out_root = Path('/tmp/out').resolve()
          Path('/tmp/out/session-execution.json').write_text(json.dumps({
            'version':1,
            'request_id':os.environ['REQUEST_ID'],
            'engine_code_commit':os.environ['ENGINE_CODE_COMMIT'],
            'opening_commit':os.environ['GITHUB_SHA'],
            'workflow_run_id':int(os.environ['GITHUB_RUN_ID']),
            'execution_surface':'github-hosted-public-engine-ephemeral-session',
            'result_transport':'encrypted-git-result-branch',
            'plaintext_persisted':False,
            'return_policy':'EXPECTED_OUTPUTS_ONLY'
          },indent=2)+'\n',encoding='utf-8')

          return_root = Path('/tmp/authorized-return')
          shutil.rmtree(return_root, ignore_errors=True)
          return_root.mkdir(parents=True)

          if os.environ.get('EXECUTION_OUTCOME_FOR_RETURN') == 'success':
              job = yaml.safe_load((Path('/tmp/job') / os.environ['ENGINE_JOB_FILE']).read_text(encoding='utf-8')) or {}
              blocks = {
                  b.get('block_id'): b
                  for b in (job.get('blocks') or [])
                  if isinstance(b, dict)
              }
              block = blocks.get(os.environ['ENGINE_BLOCK_ID'])
              if not block:
                  raise SystemExit('return allowlist cannot resolve executed block')
              expected = block.get('expected_outputs')
              if not isinstance(expected, list) or not expected or not all(isinstance(x, str) and x for x in expected):
                  raise SystemExit('return allowlist requires non-empty expected_outputs')
              if len(set(expected)) != len(expected):
                  raise SystemExit('return allowlist contains duplicate expected_outputs')

              block_out = (out_root / str(job.get('job_id')) / os.environ['ENGINE_BLOCK_ID']).resolve()
              if out_root != block_out and out_root not in block_out.parents:
                  raise SystemExit('resolved block output escaped /tmp/out')

              copied = []
              for rel_raw in expected:
                  rel = Path(rel_raw)
                  if rel.is_absolute() or '..' in rel.parts:
                      raise SystemExit(f'unsafe expected output path: {rel_raw}')
                  src = (block_out / rel).resolve()
                  if block_out != src and block_out not in src.parents:
                      raise SystemExit(f'expected output escaped block output: {rel_raw}')
                  if not src.is_file() or src.stat().st_size <= 0:
                      raise SystemExit(f'authorized expected output missing/empty: {rel_raw}')
                  dst = (return_root / rel).resolve()
                  if return_root.resolve() != dst and return_root.resolve() not in dst.parents:
                      raise SystemExit(f'return target escaped allowlist root: {rel_raw}')
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dst)
                  copied.append(rel.as_posix())

              actual = sorted(
                  p.relative_to(return_root).as_posix()
                  for p in return_root.rglob('*')
                  if p.is_file()
              )
              if actual != sorted(expected):
                  raise SystemExit(f'authorized return mismatch: expected={sorted(expected)} actual={actual}')
              print(f'PASS: encrypted return allowlist exact files={actual}')
          else:
              print('Execution failed: encrypted return payload intentionally contains no product files; use workflow logs for diagnosis.')

          shutil.make_archive('/tmp/result','zip',return_root)
          PY
          pdf-session seal --public-key "$RETURN_PUBLIC_KEY" --request-id "$REQUEST_ID" --input /tmp/result.zip --output /tmp/result.sealed
          sha256sum /tmp/result.sealed | awk '{print $1}' > /tmp/result.sealed.sha256

      - name: Publish encrypted result to temporary Git result branch
        if: always()
        env:
          EXECUTION_OUTCOME: ${{ steps.execute_resource.outcome }}
        run: |
          rm -rf /tmp/result-repo
          git worktree add --detach /tmp/result-repo "$GITHUB_SHA"
          cd /tmp/result-repo
          git switch -C "$RESULT_BRANCH"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p ".engine-session/$REQUEST_ID"
          base64 -w0 /tmp/result.sealed > ".engine-session/$REQUEST_ID/result.sealed.b64"
          cp /tmp/result.sealed.sha256 ".engine-session/$REQUEST_ID/result.sha256"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('.engine-session')/os.environ['REQUEST_ID']/'result.json'
          p.write_text(json.dumps({
            'version':1,
            'schema':'pdf-engine-session-result-v1',
            'request_id':os.environ['REQUEST_ID'],
            'result_branch':os.environ['RESULT_BRANCH'],
            'opening_commit':os.environ['GITHUB_SHA'],
            'engine_commit':os.environ['ENGINE_CODE_COMMIT'],
            'workflow_run_id':int(os.environ['GITHUB_RUN_ID']),
            'execution_outcome':os.environ['EXECUTION_OUTCOME'],
            'ciphertext_sha256':Path(f".engine-session/{os.environ['REQUEST_ID']}/result.sha256").read_text().strip(),
            'transport':'encrypted-git-result-branch',
            'plaintext_persisted':False
          },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git add ".engine-session/$REQUEST_ID/result.sealed.b64" ".engine-session/$REQUEST_ID/result.sha256" ".engine-session/$REQUEST_ID/result.json"
          git commit -m "session: result $REQUEST_ID"
          git push --force origin "HEAD:refs/heads/$RESULT_BRANCH"
          echo "RESULT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          cd "$GITHUB_WORKSPACE"
          git worktree remove --force /tmp/result-repo

      - name: Publish result branch status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXECUTION_OUTCOME_FOR_STATUS: ${{ steps.execute_resource.outcome }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          state='success' if os.environ.get('EXECUTION_OUTCOME_FOR_STATUS','')=='success' else 'failure'
          desc=f"branch={os.environ['RESULT_BRANCH']} request={os.environ['REQUEST_ID']}"
          req=urllib.request.Request(
            f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
            data=json.dumps({'state':state,'context':'pdf-engine/session-result','description':desc[:140]}).encode(),
            headers={'Authorization':f"Bearer {os.environ['GITHUB_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},
            method='POST')
          urllib.request.urlopen(req).read()
          PY

      - name: Fail job after preserving encrypted failure evidence
        if: steps.execute_resource.outcome == 'failure'
        run: python -c "raise SystemExit(2)"

      - name: Cleanup
        if: always()
        run: rm -rf /tmp/session-private.key /tmp/session-public.txt /tmp/input.sealed /tmp/input.sha256 /tmp/job /tmp/job.zip /tmp/out /tmp/result.zip /tmp/result.sealed /tmp/result.sealed.sha256 /tmp/result-repo
