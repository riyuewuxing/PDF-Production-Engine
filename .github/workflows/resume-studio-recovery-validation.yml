name: Resume Studio V6 damaged document recovery
on:
  push:
    branches: ['resume-studio/v6-recovery-validation']
permissions:
  contents: read
concurrency:
  group: resume-studio-v6-recovery-validation
  cancel-in-progress: true
jobs:
  windows-damaged-document-recovery:
    runs-on: windows-latest
    timeout-minutes: 14
    defaults:
      run:
        working-directory: resume-studio-validation/app
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned dependencies
        timeout-minutes: 4
        run: |
          npm install --global pnpm@10.30.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Reproduce prior damaged-list failures
        timeout-minutes: 2
        run: |
          $target = 'src/server/localFsApi.ts'
          $candidate = [IO.File]::ReadAllBytes((Join-Path (Get-Location) $target))
          $out = Join-Path $env:GITHUB_WORKSPACE 'resume-studio-recovery-evidence'
          New-Item -ItemType Directory -Force $out | Out-Null
          try {
            [IO.File]::WriteAllBytes((Join-Path (Get-Location) $target), [IO.File]::ReadAllBytes((Join-Path (Get-Location) 'validation-fixtures/localFsApi.turn26-baseline.txt')))
            pnpm exec vitest run src/server/resumeListRecovery.test.ts --reporter=json --outputFile="$out/baseline-vitest.json"
            $baselineCode = $LASTEXITCODE
          } finally {
            [IO.File]::WriteAllBytes((Join-Path (Get-Location) $target), $candidate)
          }
          $report = Get-Content "$out/baseline-vitest.json" -Raw | ConvertFrom-Json
          if ($baselineCode -eq 0 -or $report.numFailedTests -ne 5 -or $report.numPassedTests -ne 1 -or $report.numTotalTests -ne 6) { throw 'Unexpected baseline reproduction' }
          $failed = @($report.testResults[0].assertionResults | Where-Object { $_.status -eq 'failed' })
          if ($failed.Count -ne 5 -or @($failed | Where-Object {$_.failureMessages -match 'JSON|校验'}).Count -ne 5) { throw 'Unexpected baseline failure causes' }
          $LASTEXITCODE = 0
      - name: Candidate typecheck
        timeout-minutes: 2
        run: pnpm typecheck
      - name: Full synthetic unit regression
        timeout-minutes: 3
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'resume-studio-recovery-evidence'
          pnpm exec vitest run --reporter=json --outputFile="$out/candidate-vitest.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build actual Electron application
        timeout-minutes: 3
        run: pnpm desktop:build
      - name: Actual Electron mixed healthy and damaged versions
        timeout-minutes: 2
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $env:RESUME_STUDIO_DATA_DIR = Join-Path $env:RUNNER_TEMP ('synthetic-list-mixed-' + [guid]::NewGuid().ToString())
          $env:RESUME_STUDIO_EVIDENCE_OUT = Join-Path $env:GITHUB_WORKSPACE 'resume-studio-recovery-evidence\mixed'
          $env:RESUME_STUDIO_LIST_MODE = 'mixed'
          & .\node_modules\.bin\electron.cmd .\validation-list-recovery.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual Electron all-damaged workspace and recovery copy
        timeout-minutes: 2
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $env:RESUME_STUDIO_DATA_DIR = Join-Path $env:RUNNER_TEMP ('synthetic-list-all-' + [guid]::NewGuid().ToString())
          $env:RESUME_STUDIO_EVIDENCE_OUT = Join-Path $env:GITHUB_WORKSPACE 'resume-studio-recovery-evidence\all-corrupt'
          $env:RESUME_STUDIO_LIST_MODE = 'all-corrupt'
          & .\node_modules\.bin\electron.cmd .\validation-list-recovery.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore and launch verified backup directly from the startup error screen
        timeout-minutes: 3
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $env:RESUME_STUDIO_DATA_DIR = Join-Path $env:RUNNER_TEMP ('synthetic-list-backup-' + [guid]::NewGuid().ToString())
          $env:RESUME_STUDIO_EVIDENCE_OUT = Join-Path $env:GITHUB_WORKSPACE 'resume-studio-recovery-evidence\backup-only'
          & .\node_modules\.bin\electron.cmd .\validation-startup-backup.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload damaged document recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resume-studio-damaged-document-evidence
          path: resume-studio-recovery-evidence/
          if-no-files-found: ignore
          retention-days: 3
