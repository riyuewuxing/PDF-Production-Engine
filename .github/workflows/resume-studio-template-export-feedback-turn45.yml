name: Resume Studio T45 feedback fix verification
on:
  push:
    branches: ['resume-studio/v6-template-export-feedback-turn45']
permissions:
  contents: read
concurrency:
  group: resume-studio-v6-template-export-feedback-turn45
  cancel-in-progress: true
jobs:
  cross-format:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: resume-studio-validation/app
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned dependencies
        timeout-minutes: 4
        run: |
          npm install --global pnpm@10.30.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Candidate typecheck
        timeout-minutes: 2
        run: pnpm typecheck
      - name: Full Windows regression
        timeout-minutes: 3
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'resume-studio-export-integrity-final'
          New-Item -ItemType Directory -Force $out | Out-Null
          pnpm exec vitest run --reporter=json --outputFile="$out/candidate-vitest.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build actual Electron application
        timeout-minutes: 3
        run: pnpm desktop:build
      - name: Full actual Electron regression
        timeout-minutes: 4
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $env:RESUME_STUDIO_DATA_DIR = Join-Path $env:RUNNER_TEMP ('resume-studio-synthetic-' + [guid]::NewGuid().ToString())
          $env:RESUME_STUDIO_EVIDENCE_OUT = Join-Path $env:GITHUB_WORKSPACE 'resume-studio-export-integrity-final/application'
          & .\node_modules\.bin\electron.cmd .\validation-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual normal receipt and archived source scenario
        timeout-minutes: 2
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $env:RESUME_STUDIO_DATA_DIR = Join-Path $env:RUNNER_TEMP ('synthetic-export-normal-' + [guid]::NewGuid().ToString())
          $env:RESUME_STUDIO_EVIDENCE_OUT = Join-Path $env:GITHUB_WORKSPACE 'resume-studio-export-integrity-final\normal'
          & .\node_modules\.bin\electron.cmd .\validation-export-normal.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned PDF audit dependency
        timeout-minutes: 2
        run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.7
      - name: Verify ordinary and concurrent cover-letter PDFs
        timeout-minutes: 2
        run: python validation-export-normal-audit.py --root (Join-Path $env:GITHUB_WORKSPACE 'resume-studio-export-integrity-final\normal') --runner-sha $env:GITHUB_SHA
      - name: Upload actual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: turn45-cross-format
          path: resume-studio-export-integrity-final/
          if-no-files-found: error
          retention-days: 3

  portrait:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: resume-studio-validation/app
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned dependencies
        timeout-minutes: 4
        run: |
          npm install --global pnpm@10.30.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build actual desktop application
        timeout-minutes: 3
        run: pnpm desktop:build
      - name: Actual managed portrait positive and negative exports and warning UI
        timeout-minutes: 3
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $env:RESUME_STUDIO_DATA_DIR = Join-Path $env:RUNNER_TEMP ('synthetic-contained-export-' + [guid]::NewGuid().ToString())
          $env:RESUME_STUDIO_EVIDENCE_OUT = Join-Path $env:GITHUB_WORKSPACE 'resume-studio-portrait-receipts'
          & .\node_modules\.bin\electron.cmd .\validation-managed-export.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned PDF audit dependency
        timeout-minutes: 2
        run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.7
      - name: Audit actual portrait bytes and pixels
        timeout-minutes: 2
        run: python validation-managed-export-audit.py --root (Join-Path $env:GITHUB_WORKSPACE 'resume-studio-portrait-receipts') --runner-sha $env:GITHUB_SHA
      - name: Upload portrait evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resume-studio-portrait-receipts
          path: resume-studio-portrait-receipts/
          if-no-files-found: error
          retention-days: 3

  workflow:
    runs-on: windows-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: resume-studio-validation/app
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked dependencies
        timeout-minutes: 4
        run: |
          npm install --global pnpm@10.30.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build actual Electron application
        timeout-minutes: 3
        run: |
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm desktop:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual multi-job UI, real PDF and ZIP, cold restart
        timeout-minutes: 9
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $env:RESUME_STUDIO_DATA_DIR = Join-Path $env:RUNNER_TEMP ('synthetic-queue-workflow-' + [guid]::NewGuid().ToString())
          $env:RESUME_STUDIO_EVIDENCE_OUT = Join-Path $env:GITHUB_WORKSPACE 'queue-workflow-evidence'
          foreach ($mode in @('main','restart')) {
            $env:QUEUE_PHASE = $mode
            & .\node_modules\.bin\electron.cmd .\validation-job-queue-workflow.cjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Independently verify actual ZIP bytes
        timeout-minutes: 1
        run: |
          python -c "import os, pathlib, zipfile, hashlib, json; p=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'queue-workflow-evidence'; z=zipfile.ZipFile(p/'actual-scoped-package.zip'); assert z.namelist()==['resume.pdf','attachment-01.pdf']; assert z.testzip() is None; assert z.read('resume.pdf')==(p/'expected-resume.pdf').read_bytes(); assert z.read('attachment-01.pdf')==(p/'expected-letter.pdf').read_bytes(); (p/'independent-zip-verification.json').write_text(json.dumps({'crc':True,'entries':z.namelist(),'exactBytes':True,'sha256':hashlib.sha256((p/'actual-scoped-package.zip').read_bytes()).hexdigest()}))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload actual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: queue-workflow-evidence
          path: queue-workflow-evidence/
          if-no-files-found: warn
          retention-days: 3
