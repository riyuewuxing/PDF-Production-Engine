name: Resume Studio V6 isolated context export safety
on:
  push:
    branches: ['resume-studio/v6-context-validation']
permissions:
  contents: read
concurrency:
  group: resume-studio-v6-context-validation
  cancel-in-progress: true
jobs:
  windows-context-safety:
    runs-on: windows-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: resume-studio-validation/app
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Baseline privacy and cleanup reproduction plus candidate roundtrip
        timeout-minutes: 3
        env:
          RESUME_STUDIO_CONTEXT_SOURCE_SHA: 8b89f90781d4e0abd156bc1056a2c2c391341857
        run: |
          $env:RESUME_STUDIO_CONTEXT_EVIDENCE = Join-Path $env:GITHUB_WORKSPACE 'resume-studio-context-evidence'
          node validation-context-safety.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Full public application source tree and zero-change delta
        timeout-minutes: 3
        env:
          RESUME_STUDIO_CONTEXT_SOURCE_SHA: 8b89f90781d4e0abd156bc1056a2c2c391341857
        run: |
          $env:RESUME_STUDIO_CONTEXT_EVIDENCE = Join-Path $env:GITHUB_WORKSPACE 'resume-studio-context-evidence'
          node validation-context-scale.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload context evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resume-studio-context-safety-evidence
          path: resume-studio-context-evidence/
          if-no-files-found: ignore
          retention-days: 3
