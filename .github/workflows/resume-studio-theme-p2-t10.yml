name: Resume Studio P2 T10 first palette expansion
on:
  push:
    branches: ['resume-studio/theme-p2-t10-candidate']
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - phase: baseline
            group: baseline
          - phase: candidate
            group: pilot
          - phase: candidate
            group: new
    runs-on: windows-latest
    timeout-minutes: 16
    defaults:
      run:
        shell: pwsh
        working-directory: resume-studio-validation/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 10
      - name: Restore exact T09 product source for baseline
        if: matrix.phase == 'baseline'
        working-directory: .
        timeout-minutes: 2
        run: |
          git fetch --no-tags --depth=1 origin f74ee48341fe589b62f58e8e15acbf85cb4ae715
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git restore --source=f74ee48341fe589b62f58e8e15acbf85cb4ae715 --worktree --staged -- resume-studio-validation/app/src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked dependencies
        timeout-minutes: 4
        run: |
          npm install --global pnpm@10.30.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Typecheck and full regression
        if: matrix.group == 'new'
        timeout-minutes: 4
        run: |
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build actual Electron app
        timeout-minutes: 3
        run: |
          pnpm desktop:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real Electron scene and export evidence
        timeout-minutes: 8
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $env:RESUME_STUDIO_DATA_DIR = Join-Path $env:RUNNER_TEMP ('studio-theme-t10-' + [guid]::NewGuid().ToString())
          $env:RESUME_STUDIO_EVIDENCE_OUT = Join-Path $env:GITHUB_WORKSPACE 'theme-t10-evidence'
          $env:STUDIO_THEME_PHASE = '${{ matrix.phase }}'
          $env:STUDIO_THEME_GROUP = '${{ matrix.group }}'
          node --check .\validation-theme-p2-t10.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\node_modules\.bin\electron.cmd .\validation-theme-p2-t10.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload raw screenshots and native exports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: theme-t10-${{ matrix.group }}
          path: theme-t10-evidence/
          if-no-files-found: error
          retention-days: 3
