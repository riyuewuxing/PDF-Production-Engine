name: Phase B Materialized Runtime

on:
  push:
    branches:
      - 'job-phase-b/**'
    paths:
      - '.engine-job/phase-b-source.tgz'
      - '.engine-job/phase-b-execution-package.json'
      - '.github/workflows/phase-b-materialized-runtime.yml'

permissions:
  contents: write

jobs:
  canonical-shell-suite:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout public Engine job branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize exact private source package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .engine-job/phase-b-repo .engine-job/output
          mkdir -p .engine-job/phase-b-repo .engine-job/output
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, tarfile
          pkg=json.loads(Path('.engine-job/phase-b-execution-package.json').read_text(encoding='utf-8'))
          archive=Path('.engine-job/phase-b-source.tgz')
          actual=hashlib.sha256(archive.read_bytes()).hexdigest()
          if actual != pkg['archive_sha256']:
              raise SystemExit(f'archive sha256 mismatch: {actual}')
          root=Path('.engine-job/phase-b-repo').resolve()
          with tarfile.open(archive,'r:gz') as tf:
              for m in tf.getmembers():
                  target=(root/m.name).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f'tar path escape: {m.name}')
              tf.extractall(root)
          PY

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .engine-job/phase-b-repo/requirements-pdf.txt

      - name: Verify exact blobs and execute canonical shell suite
        id: execute
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, subprocess, time, traceback
          checkout=Path.cwd().resolve()
          root=(checkout/'.engine-job/phase-b-repo').resolve()
          pkg=json.loads((checkout/'.engine-job/phase-b-execution-package.json').read_text(encoding='utf-8'))
          out=checkout/'.engine-job/output'
          out.mkdir(parents=True,exist_ok=True)
          evidence={
            'version':1,
            'kind':'qiuzhidaren-teaching-demo-phase-b-materialized-runtime-evidence-v1',
            'status':'MACHINE_FAIL',
            'review_status':'REVIEW_REQUIRED',
            'source_repository':pkg.get('source_repository'),
            'source_commit':pkg.get('source_commit'),
            'archive_sha256':pkg.get('archive_sha256'),
            'engine_repository':os.environ.get('GITHUB_REPOSITORY'),
            'engine_execution_commit':os.environ.get('GITHUB_SHA'),
            'engine_run_id':os.environ.get('GITHUB_RUN_ID'),
            'private_repository_access_used':False,
            'private_repository_credentials_used':False,
            'live_trusted_semantic_execution':'NOT_EXECUTED',
            'gate_b_claimed':False,
            'product_pdf_generated':False,
          }
          def blob_sha(data):
              return hashlib.sha1(f'blob {len(data)}\0'.encode('ascii')+data).hexdigest()
          try:
              if pkg.get('product_pdf_allowed') is not False:
                  raise ValueError('product PDF boundary invalid')
              expected=pkg.get('files') or []
              verified=[]
              for item in expected:
                  path=(root/item['path']).resolve()
                  if root != path and root not in path.parents:
                      raise ValueError(f'path escape: {item["path"]}')
                  data=path.read_bytes()
                  actual=blob_sha(data)
                  if actual != item['git_blob_sha1']:
                      raise ValueError(f'exact source blob mismatch: {item["path"]}: expected={item["git_blob_sha1"]} actual={actual}')
                  verified.append({'path':item['path'],'git_blob_sha1':actual,'sha256':hashlib.sha256(data).hexdigest()})
              if len(verified) != pkg.get('expected_file_count'):
                  raise ValueError('verified file count drift')
              wf=root/'.github/workflows'
              if wf.exists() and list(wf.glob('*.y*ml')):
                  raise ValueError('private source package contains active workflow')
              results=[]
              for command in pkg.get('commands') or []:
                  started=time.monotonic()
                  proc=subprocess.run(command,cwd=root,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
                  output=proc.stdout or ''
                  print('>>>',' '.join(command))
                  print(output,end='')
                  results.append({'command':command,'exit_code':proc.returncode,'duration_seconds':round(time.monotonic()-started,6),'output_tail':output[-12000:]})
              pdfs=sorted(p.relative_to(root).as_posix() for p in root.rglob('*.pdf'))
              all_pass=bool(results) and all(x['exit_code']==0 for x in results) and not pdfs
              evidence.update({'status':'MACHINE_PASS' if all_pass else 'MACHINE_FAIL','verified_file_count':len(verified),'commands':results,'product_pdf_generated':bool(pdfs),'product_pdf_paths':pdfs,'runtime':{'os':os.environ.get('RUNNER_OS'),'python':os.sys.version.split()[0]}})
          except Exception as exc:
              evidence['error']=f'{type(exc).__name__}: {exc}'
              evidence['traceback']=traceback.format_exc()[-12000:]
          finally:
              (out/'phase-b-materialized-runtime-evidence.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              print('PHASE_B_EVIDENCE_JSON_BEGIN')
              print(json.dumps(evidence,ensure_ascii=False,indent=2))
              print('PHASE_B_EVIDENCE_JSON_END')
          if evidence.get('status') != 'MACHINE_PASS':
              raise SystemExit('Phase-B canonical shell suite MACHINE_FAIL')
          PY

      - name: Commit machine evidence
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .engine-job/output/phase-b-materialized-runtime-evidence.json
          if ! git diff --cached --quiet; then
            git commit -m 'job: record Phase-B materialized runtime evidence'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Enforce runtime result
        if: always()
        run: |
          test '${{ steps.execute.outcome }}' = 'success'
