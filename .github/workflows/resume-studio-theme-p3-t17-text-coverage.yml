name: T18 integrated native range and export verification
on:
  pull_request:
    branches: ['resume-studio/theme-p3-t18-secret-number']
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  native:
    if: github.event.pull_request.head.ref == 'resume-studio/theme-p3-t18-field-integration' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        theme: [classic, light, dark, highContrast]
    defaults:
      run:
        shell: pwsh
        working-directory: resume-studio-validation/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked public dependencies
        timeout-minutes: 4
        run: |
          npm install --global pnpm@10.30.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Typecheck and full regression
        if: matrix.theme == 'classic'
        timeout-minutes: 4
        run: |
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        timeout-minutes: 3
        run: pnpm desktop:build
      - name: T18 native range, mixed preference, and real export gate
        timeout-minutes: 7
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $env:T18_THEME = '${{ matrix.theme }}'
          $env:T18_EXPECTED_SHA = '${{ github.event.pull_request.head.sha }}'
          if ((git rev-parse HEAD).Trim() -ne $env:T18_EXPECTED_SHA) { throw 'Candidate checkout mismatch' }
          $env:RESUME_STUDIO_DATA_DIR = Join-Path $env:RUNNER_TEMP ('synthetic-t18-integration-' + [guid]::NewGuid().ToString())
          $env:RESUME_STUDIO_EVIDENCE_OUT = Join-Path $env:GITHUB_WORKSPACE 't18-field-integration'
          New-Item -ItemType Directory -Force -Path $env:RESUME_STUDIO_EVIDENCE_OUT | Out-Null
          try {
            & .\node_modules\.bin\electron.cmd .\validation-theme-t18-field-integration.cjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item -LiteralPath $env:RESUME_STUDIO_DATA_DIR -Recurse -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: t18-integration-${{ matrix.theme }}
          path: t18-field-integration/
          if-no-files-found: warn
          retention-days: 3
