name: Ephemeral Public Source Export

on:
  push:
    branches:
      - 'job-public/**'
    paths:
      - '.engine-job/**'

permissions:
  contents: read

jobs:
  export-source:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and verify exact public source bytes
        run: |
          python - <<'PY'
          import hashlib, shutil, urllib.request
          from pathlib import Path
          import yaml
          spec = yaml.safe_load(Path('.engine-job/locked-source.yaml').read_text(encoding='utf-8')) or {}
          url = (spec.get('urls') or [None])[0]
          exp = spec.get('expected') or {}
          if not isinstance(url, str) or not url.startswith('https://'):
              raise SystemExit('public https source required')
          out = Path('.engine-job/output/source-original.pdf')
          out.parent.mkdir(parents=True, exist_ok=True)
          req = urllib.request.Request(url, headers={'User-Agent':'pdf-engine-public-source-export/1.0','Accept-Encoding':'identity'})
          with urllib.request.urlopen(req, timeout=120) as r, out.open('wb') as fh:
              shutil.copyfileobj(r, fh, length=1024*1024)
          raw = out.read_bytes()
          if not raw.startswith(b'%PDF-'):
              raise SystemExit('not PDF')
          if int(exp.get('size_bytes')) != len(raw):
              raise SystemExit(f'size mismatch {len(raw)}')
          sha256 = hashlib.sha256(raw).hexdigest()
          git = hashlib.sha1(f'blob {len(raw)}\0'.encode() + raw).hexdigest()
          if sha256 != exp.get('sha256') or git != exp.get('git_blob_sha'):
              raise SystemExit(f'hash mismatch sha256={sha256} git={git}')
          print(f'PASS exact public source bytes size={len(raw)} sha256={sha256} git_blob={git}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exact-public-source
          path: .engine-job/output/source-original.pdf
          if-no-files-found: error
          retention-days: 1
