name: One-time purge generated artifacts
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-purge-artifacts.yml']
permissions:
  actions: write
  contents: write
jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let deleted = 0;
            while (true) {
              const { data } = await github.request('GET /repos/{owner}/{repo}/actions/artifacts', { owner, repo, per_page: 100 });
              if (!data.artifacts.length) break;
              for (const artifact of data.artifacts) {
                await github.request('DELETE /repos/{owner}/{repo}/actions/artifacts/{artifact_id}', {
                  owner, repo, artifact_id: artifact.id
                });
                deleted++;
              }
            }
            let deletedRefs = 0;
            for (const prefix of ['heads/session-job/', 'heads/session-result/']) {
              const refs = await github.paginate('GET /repos/{owner}/{repo}/git/matching-refs/{ref}', {
                owner, repo, ref: prefix, per_page: 100
              });
              for (const item of refs) {
                await github.request('DELETE /repos/{owner}/{repo}/git/refs/{ref}', {
                  owner, repo, ref: item.ref.replace('refs/', '')
                });
                deletedRefs++;
              }
            }
            core.notice(`Deleted ${deleted} artifacts and ${deletedRefs} temporary refs`);
