name: Resume Studio V6 recovery final application and release regression
on:
  push:
    branches: ['resume-studio/v6-recovery-full-validation']
    paths: ['resume-studio-validation/**', '.github/workflows/resume-studio-recovery-full.yml']
permissions:
  contents: read
concurrency:
  group: resume-studio-v6-recovery-full-validation
  cancel-in-progress: true
jobs:
  windows-application:
    runs-on: windows-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: resume-studio-validation/app
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: |
          npm install --global pnpm@10.30.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Typecheck audited runtime
        run: pnpm typecheck
      - name: Reproduce composing shortcut regression with exact prior runtime then restore candidate
        timeout-minutes: 2
        run: |
          $target = 'src/hooks/useGlobalShortcuts.ts'
          $candidate = [IO.File]::ReadAllBytes((Join-Path (Get-Location) $target))
          $out = Join-Path $env:GITHUB_WORKSPACE 'resume-studio-evidence'
          New-Item -ItemType Directory -Force $out | Out-Null
          $prior = '7c23fc446c52a4e075ad88ca080b0208b0f01206'
          # checkout is shallow: the previous source is retained as an exact public test fixture.
          $priorFile = 'validation-fixtures/useGlobalShortcuts.baseline.txt'
          try {
            [IO.File]::WriteAllBytes((Join-Path (Get-Location) $target), [IO.File]::ReadAllBytes((Join-Path (Get-Location) $priorFile)))
            pnpm exec vitest run src/hooks/useGlobalShortcutsSynthetic.test.tsx --reporter=json --outputFile="$out/ime-baseline-vitest.json"
            $baselineCode = $LASTEXITCODE
          } finally {
            [IO.File]::WriteAllBytes((Join-Path (Get-Location) $target), $candidate)
          }
          $report = Get-Content "$out/ime-baseline-vitest.json" -Raw | ConvertFrom-Json
          if ($baselineCode -eq 0 -or $report.numFailedTests -ne 2 -or $report.numPassedTests -ne 1 -or $report.numTotalTests -ne 3) { throw 'Unexpected baseline reproduction' }
          $failed = @($report.testResults[0].assertionResults | Where-Object { $_.status -eq 'failed' })
          if ($failed.Count -ne 2 -or -not ($failed[0].title -like '*composing*') -or -not ($failed[1].title -like '*229*')) { throw 'Unexpected baseline failures' }
          $LASTEXITCODE = 0
      - name: All audited synthetic-runner regression tests
        run: pnpm test
      - name: Build actual Electron application
        run: pnpm desktop:build
      - name: Actual production bootstrap with only damaged documents
        timeout-minutes: 2
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $env:RESUME_STUDIO_BOOTSTRAP_OUT = Join-Path $env:GITHUB_WORKSPACE 'resume-studio-evidence\production-startup'
          node validation-production-startup.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run real application with synthetic fixture and failure injection
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $env:RESUME_STUDIO_DATA_DIR = Join-Path $env:RUNNER_TEMP 'resume-studio-v6-synthetic'
          $env:RESUME_STUDIO_EVIDENCE_OUT = Join-Path $env:GITHUB_WORKSPACE 'resume-studio-evidence'
          & .\node_modules\.bin\electron.cmd .\validation-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Import hidden or missing basic section through actual JSON picker and restore explicitly
        timeout-minutes: 2
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $env:RESUME_STUDIO_DATA_DIR = Join-Path $env:RUNNER_TEMP 'resume-studio-v6-import-visibility'
          $env:RESUME_STUDIO_EVIDENCE_OUT = Join-Path $env:GITHUB_WORKSPACE 'resume-studio-evidence\import-visibility'
          & .\node_modules\.bin\electron.cmd .\validation-import-visibility.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual editor template, discrete history and cross-version undo isolation
        timeout-minutes: 3
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $env:RESUME_STUDIO_DATA_DIR = Join-Path $env:RUNNER_TEMP ('editor-history-' + [guid]::NewGuid().ToString())
          $env:RESUME_STUDIO_EVIDENCE_OUT = Join-Path $env:GITHUB_WORKSPACE 'resume-studio-evidence\editor-history'
          & .\node_modules\.bin\electron.cmd .\validation-editor-history.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Force terminate and restart real Electron with unsaved synthetic drafts
        timeout-minutes: 3
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $env:RESUME_STUDIO_CRASH_OUT = Join-Path $env:GITHUB_WORKSPACE 'resume-studio-crash-evidence'
          node scripts/qa-crash-draft.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload crash recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resume-studio-crash-evidence
          path: resume-studio-crash-evidence/
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload synthetic application evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resume-studio-application-evidence
          path: resume-studio-evidence/
          if-no-files-found: ignore
          retention-days: 3


  pagination-matrix:
    runs-on: windows-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - locale: zh-CN
            modes: natural
            suite: natural
          - locale: en-US
            modes: natural
            suite: natural
          - locale: zh-CN
            modes: compact,extended
            suite: legacy
          - locale: en-US
            modes: compact,extended
            suite: legacy
          - locale: zh-CN
            modes: contacts
            suite: contacts
          - locale: en-US
            modes: contacts
            suite: contacts
    defaults:
      run:
        working-directory: resume-studio-validation/app
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: |
          npm install --global pnpm@10.30.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build actual Electron application
        run: pnpm desktop:build
      - name: Render actual template matrix
        env:
          RESUME_MATRIX_LOCALE: ${{ matrix.locale }}
          RESUME_MATRIX_MODES: ${{ matrix.modes }}
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $env:RESUME_MATRIX_SOURCE_SHA = (Get-Content runner-manifest.json -Raw | ConvertFrom-Json).sourceSha
          $env:RESUME_MATRIX_OUT = Join-Path $env:GITHUB_WORKSPACE 'natural-matrix'
          & .\node_modules\.bin\electron.cmd .\scripts\qa-template-matrix.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned PDF audit dependency
        timeout-minutes: 2
        run: |
          python -m pip install --disable-pip-version-check PyMuPDF==1.26.7
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Audit actual PDF output
        timeout-minutes: 2
        run: |
          $source = (Get-Content runner-manifest.json -Raw | ConvertFrom-Json).sourceSha
          python scripts/qa-audit-template-matrix.py --root (Join-Path $env:GITHUB_WORKSPACE 'natural-matrix') --locale '${{ matrix.locale }}' --modes '${{ matrix.modes }}' --source-sha $source --runner-sha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload PDF matrix and audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pagination-${{ matrix.suite }}-${{ matrix.locale }}
          path: natural-matrix/
          if-no-files-found: error
          retention-days: 3


  windows-portable-launch:
    runs-on: windows-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: resume-studio-validation/app
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: |
          npm install --global pnpm@10.30.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build actual Electron application
        run: pnpm desktop:build
      - name: Reproduce locked source loss and validate safe replacement with synthetic files
        timeout-minutes: 2
        run: |
          ./validation-postpack.ps1 -EvidenceDir (Join-Path $env:GITHUB_WORKSPACE 'resume-studio-portable-evidence')
      - name: Pack actual portable executable (synthetic icon)
        timeout-minutes: 5
        run: |
          # Public validation does not include the private binary icon.
          Add-Type -AssemblyName System.Drawing
          $bitmap = [System.Drawing.Bitmap]::new(256, 256)
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.Clear([System.Drawing.Color]::Teal)
          $graphics.FillRectangle([System.Drawing.Brushes]::White,64,48,128,160)
          $icon = [System.Drawing.Icon]::FromHandle($bitmap.GetHicon())
          $stream = [System.IO.File]::Create((Join-Path (Get-Location) 'build\icon.ico'))
          try { $icon.Save($stream) } finally { $stream.Dispose(); $icon.Dispose(); $graphics.Dispose(); $bitmap.Dispose() }
          pnpm exec electron-builder --win portable --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Inspect actual ASAR and relocate real portable to repository root
        timeout-minutes: 2
        run: |
          $env:RESUME_STUDIO_PORTABLE_EVIDENCE = Join-Path $env:GITHUB_WORKSPACE 'resume-studio-portable-evidence'
          node validation-asar.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $built = Join-Path (Get-Location) 'release\Resume Studio.exe'
          $rootExe = Join-Path (Get-Location) 'Resume Studio.exe'
          [IO.File]::WriteAllText($rootExe,'OLD_SYNTHETIC_LAUNCHER')
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'release\keep-synthetic.txt'),'PRESERVE_RELEASE')
          $expected = (Get-FileHash -LiteralPath $built -Algorithm SHA256).Hash
          node scripts/postpack-win.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = (Get-FileHash -LiteralPath $rootExe -Algorithm SHA256).Hash
          if ($actual -ne $expected -or (Test-Path -LiteralPath $built) -or ((Get-Content 'release/keep-synthetic.txt' -Raw) -ne 'PRESERVE_RELEASE')) { throw 'Portable relocation evidence mismatch' }
          [ordered]@{sha256=$actual;bytes=(Get-Item -LiteralPath $rootExe).Length;sourceConsumed=$true;unrelatedPreserved=$true;sourceSha=(Get-Content runner-manifest.json -Raw | ConvertFrom-Json).sourceSha;runnerSha=$env:GITHUB_SHA} | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $env:RESUME_STUDIO_PORTABLE_EVIDENCE 'actual-root-executable.json')
      - name: Open two real portable workspaces with separate extraction roots
        timeout-minutes: 4
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $env:RESUME_STUDIO_PORTABLE_EVIDENCE = Join-Path $env:GITHUB_WORKSPACE 'resume-studio-portable-evidence'
          $env:RESUME_STUDIO_PORTABLE_WRAPPER = Join-Path (Get-Location) 'Resume Studio.exe'
          pnpm exec tsx scripts/qa-portable-launch.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload portable launch evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resume-studio-portable-evidence
          path: resume-studio-portable-evidence/
          if-no-files-found: ignore
          retention-days: 3
