name: Sealed Engine Key Bootstrap

on:
  push:
    branches:
      - feat/pdf-production-engine-v1
    paths:
      - '.github/workflows/sealed-key-bootstrap.yml'
      - 'src/pdf_production_engine/sealed_handoff.py'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  publish-public-key:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Derive and publish shareable public key
        env:
          ENGINE_SEALED_PRIVATE_KEY: ${{ secrets.ENGINE_SEALED_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']
          token = os.environ['GH_TOKEN']
          private_key = os.environ.get('ENGINE_SEALED_PRIVATE_KEY', '').strip()

          def publish(context: str, state: str, description: str) -> None:
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/statuses/{sha}',
                  data=json.dumps({
                      'state': state,
                      'context': context,
                      'description': description[:140],
                  }).encode(),
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
                  method='POST',
              )
              with urllib.request.urlopen(req) as response:
                  assert response.status == 201

          publish('pdf-engine/sealed-key/bootstrap-started', 'success', 'bootstrap workflow reached key derivation step')

          if not private_key:
              publish('pdf-engine/sealed-key/missing-secret', 'error', 'ENGINE_SEALED_PRIVATE_KEY missing')
              raise SystemExit('ENGINE_SEALED_PRIVATE_KEY is not configured')

          try:
              proc = subprocess.run(
                  ['pdf-sealed', 'public', '--private-key', private_key],
                  check=True,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
          except subprocess.CalledProcessError as exc:
              publish('pdf-engine/sealed-key/derive-failed', 'error', 'configured private key could not be parsed')
              print(exc.stdout)
              raise

          line = next((line for line in proc.stdout.splitlines() if line.startswith('PUBLIC_KEY=')), '')
          public_key = line.partition('=')[2].strip()
          if not public_key:
              publish('pdf-engine/sealed-key/derive-failed', 'error', 'public key derivation produced no key')
              raise SystemExit('public key derivation produced no key')

          publish('pdf-engine/sealed-key', 'success', 'engine sealed-box public key is available')
          publish(f'pdf-engine/sealed-key/{public_key}', 'success', 'machine-readable public key')
          print('Published shareable engine public key in commit status context; private key was not exposed.')
          PY
