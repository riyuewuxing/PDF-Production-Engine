name: Sealed Engine Key Bootstrap

on:
  push:
    branches:
      - feat/pdf-production-engine-v1
    paths:
      - '.github/workflows/sealed-key-bootstrap.yml'
      - 'src/pdf_production_engine/sealed_handoff.py'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  publish-public-key:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Derive and publish shareable public key
        env:
          ENGINE_SEALED_PRIVATE_KEY: ${{ secrets.ENGINE_SEALED_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']
          token = os.environ['GH_TOKEN']
          private_key = os.environ.get('ENGINE_SEALED_PRIVATE_KEY', '').strip()

          def publish(state: str, description: str) -> None:
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/statuses/{sha}',
                  data=json.dumps({
                      'state': state,
                      'context': 'pdf-engine/sealed-key',
                      'description': description[:140],
                  }).encode(),
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
                  method='POST',
              )
              with urllib.request.urlopen(req) as response:
                  assert response.status == 201

          if not private_key:
              publish('error', 'ENGINE_SEALED_PRIVATE_KEY missing')
              raise SystemExit('ENGINE_SEALED_PRIVATE_KEY is not configured')

          proc = subprocess.run(
              ['pdf-sealed', 'public', '--private-key', private_key],
              check=True,
              text=True,
              stdout=subprocess.PIPE,
          )
          line = next((line for line in proc.stdout.splitlines() if line.startswith('PUBLIC_KEY=')), '')
          public_key = line.partition('=')[2].strip()
          if not public_key:
              publish('error', 'failed to derive sealed public key')
              raise SystemExit('public key derivation produced no key')

          publish('success', f'ENGINE_PUBLIC_KEY={public_key}')
          print('Published shareable engine public key in commit status; private key was not exposed.')
          PY
