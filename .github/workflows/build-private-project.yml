name: Build Private Project PDF

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: 'Private consumer repo, owner/name'
        required: true
        type: string
      project_branch:
        description: 'Consumer branch to read and write back'
        required: true
        type: string
      manifest_path:
        description: 'Build manifest path inside consumer repo'
        required: true
        type: string
      requirements_path:
        description: 'Optional pip requirements file inside consumer repo'
        required: false
        default: ''
        type: string
      install_xelatex:
        description: 'Install XeLaTeX/CJK runtime for command backends'
        required: true
        default: false
        type: boolean
      return_pdf_path:
        description: 'Private repo path for final PDF'
        required: true
        type: string
      return_render_dir:
        description: 'Optional private repo directory for rendered pages'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  trusted-private-build:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout public PDF engine
        uses: actions/checkout@v4
        with:
          path: engine

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e engine

      - name: Install optional XeLaTeX runtime
        if: inputs.install_xelatex
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-lang-chinese \
            fonts-arphic-ukai fonts-arphic-uming fonts-wqy-zenhei

      - name: Require least-privilege project token
        env:
          PROJECT_REPO_TOKEN: ${{ secrets.PROJECT_REPO_TOKEN }}
        run: |
          test -n "$PROJECT_REPO_TOKEN" || { echo 'PROJECT_REPO_TOKEN secret is not configured'; exit 2; }

      - name: Checkout private consumer project
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.project_branch }}
          token: ${{ secrets.PROJECT_REPO_TOKEN }}
          path: project
          persist-credentials: true

      - name: Install consumer Python requirements
        if: inputs.requirements_path != ''
        env:
          REQUIREMENTS_PATH: ${{ inputs.requirements_path }}
        run: python -m pip install -r "project/$REQUIREMENTS_PATH"

      - name: Build, preflight, and render private PDF
        env:
          MANIFEST_PATH: ${{ inputs.manifest_path }}
        run: |
          rm -rf private-output
          pdf-production build \
            --root project \
            --manifest "$MANIFEST_PATH" \
            --out private-output \
            --dpi 144

      - name: Copy PDF and evidence back into private checkout
        env:
          RETURN_PDF_PATH: ${{ inputs.return_pdf_path }}
          RETURN_RENDER_DIR: ${{ inputs.return_render_dir }}
        run: |
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path

          project = Path('project').resolve()
          manifests = list(Path('private-output').glob('*/build-manifest.json'))
          if len(manifests) != 1:
              raise SystemExit(f'expected exactly one build manifest, found {len(manifests)}')
          evidence = manifests[0]
          data = json.loads(evidence.read_text(encoding='utf-8'))
          source_pdf = evidence.parent / data['pdf']['filename']

          def safe_private(relative: str) -> Path:
              p = Path(relative)
              if not relative or p.is_absolute():
                  raise SystemExit(f'private destination must be relative: {relative!r}')
              target = (project / p).resolve()
              if project != target and project not in target.parents:
                  raise SystemExit(f'private destination escapes repo: {relative}')
              return target

          dest_pdf = safe_private(os.environ['RETURN_PDF_PATH'])
          dest_pdf.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(source_pdf, dest_pdf)
          shutil.copy2(evidence, dest_pdf.with_suffix(dest_pdf.suffix + '.build.json'))

          render_relative = os.environ.get('RETURN_RENDER_DIR', '').strip()
          if render_relative:
              dest_render = safe_private(render_relative)
              if dest_render.exists():
                  shutil.rmtree(dest_render)
              shutil.copytree(evidence.parent / 'rendered', dest_render)

          print(f"PRIVATE_DELIVERY_READY pages={data['qa']['page_count']} sha256={data['pdf']['sha256']}")
          print('Private PDF bytes were not uploaded as a public Actions artifact.')
          PY

      - name: Commit deterministic outputs to private project
        env:
          PROJECT_BRANCH: ${{ inputs.project_branch }}
          RETURN_PDF_PATH: ${{ inputs.return_pdf_path }}
          RETURN_RENDER_DIR: ${{ inputs.return_render_dir }}
        run: |
          cd project
          git config user.name 'pdf-production-engine[bot]'
          git config user.email 'pdf-production-engine@users.noreply.github.com'
          git add -- "$RETURN_PDF_PATH" "$RETURN_PDF_PATH.build.json"
          if test -n "$RETURN_RENDER_DIR"; then
            git add -- "$RETURN_RENDER_DIR"
          fi
          if git diff --cached --quiet; then
            echo 'No private output changes to commit.'
          else
            git commit -m 'build(pdf): update generated PDF evidence'
            git push origin "HEAD:$PROJECT_BRANCH"
          fi

      - name: Confirm privacy boundary
        if: always()
        run: |
          echo 'No upload-artifact step exists in this private-build workflow.'
          echo 'Do not print or cat private source, generated PDF, rendered pages, or backend.log.'
