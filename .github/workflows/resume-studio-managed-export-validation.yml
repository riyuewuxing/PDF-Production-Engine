name: Resume Studio V6 managed portrait export containment
on:
  push:
    branches: ['resume-studio/v6-managed-export-validation']
permissions:
  contents: read
concurrency:
  group: resume-studio-v6-managed-export-validation
  cancel-in-progress: true
jobs:
  windows-managed-export:
    runs-on: windows-latest
    timeout-minutes: 9
    defaults:
      run:
        working-directory: resume-studio-validation/app
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned dependencies
        timeout-minutes: 4
        run: |
          npm install --global pnpm@10.30.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build actual audited desktop application
        timeout-minutes: 3
        run: pnpm desktop:build
      - name: Generate eight actual exports through trusted editor IPC
        timeout-minutes: 3
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $env:RESUME_STUDIO_DATA_DIR = Join-Path $env:RUNNER_TEMP ('synthetic-contained-export-' + [guid]::NewGuid().ToString())
          $env:RESUME_STUDIO_EVIDENCE_OUT = Join-Path $env:GITHUB_WORKSPACE 'resume-studio-managed-export-evidence'
          & .\node_modules\.bin\electron.cmd .\validation-managed-export.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned PDF and image audit dependency
        timeout-minutes: 2
        run: |
          python -m pip install --disable-pip-version-check PyMuPDF==1.26.7
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Audit actual PDF, PNG, DOCX and HTML portrait contents
        timeout-minutes: 2
        run: |
          python validation-managed-export-audit.py --root (Join-Path $env:GITHUB_WORKSPACE 'resume-studio-managed-export-evidence') --runner-sha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload actual output and audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resume-studio-managed-export-evidence
          path: resume-studio-managed-export-evidence/
          if-no-files-found: error
          retention-days: 3
