name: Resume Studio T02 document boundary fixtures
on:
  push:
    branches: ['resume-studio/theme-p1-t02-fixtures']
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        phase: [baseline, candidate]
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: resume-studio-validation/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 12
      - name: Restore exact old source for baseline only
        if: matrix.phase == 'baseline'
        working-directory: .
        timeout-minutes: 1
        run: |
          git restore --source=408f904127998c3099c5bd92ad2e0775271554e6 --worktree --staged -- resume-studio-validation/app/src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked dependencies
        timeout-minutes: 4
        run: |
          npm install --global pnpm@10.30.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build actual Electron app
        timeout-minutes: 3
        run: |
          pnpm desktop:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real Windows scroll, spread and native exports for four fixtures
        timeout-minutes: 8
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $env:STUDIO_THEME_PHASE = '${{ matrix.phase }}'
          foreach ($kind in @('near','natural','manual','dark')) {
            $env:STUDIO_FIXTURE_KIND = $kind
            $env:RESUME_STUDIO_DATA_DIR = Join-Path $env:RUNNER_TEMP ('studio-t02-fixture-' + $kind + '-' + [guid]::NewGuid().ToString())
            $env:RESUME_STUDIO_EVIDENCE_OUT = Join-Path $env:GITHUB_WORKSPACE ('theme-t02-fixtures/' + $kind)
            & .\node_modules\.bin\electron.cmd .\validation-theme-fixtures.cjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Upload original evidence including failed fixture
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: theme-t02-fixtures-${{ matrix.phase }}
          path: theme-t02-fixtures/
          if-no-files-found: warn
          retention-days: 3
