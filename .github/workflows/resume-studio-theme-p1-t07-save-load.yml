name: Resume Studio T07 actual startup loading, transition and failed save recovery
on:
  push:
    branches: ['resume-studio/theme-p1-t07-save-load']
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        suite: [save-load]
    runs-on: windows-latest
    timeout-minutes: 14
    defaults:
      run:
        shell: pwsh
        working-directory: resume-studio-validation/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked dependencies
        timeout-minutes: 4
        run: |
          npm install --global pnpm@10.30.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Typecheck and actual desktop build
        timeout-minutes: 3
        run: |
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm desktop:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual native operation and four-theme matrix
        timeout-minutes: 6
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $env:RESUME_STUDIO_DATA_DIR = Join-Path $env:RUNNER_TEMP ('synthetic-t07-save-' + [guid]::NewGuid().ToString())
          $env:RESUME_STUDIO_EVIDENCE_OUT = Join-Path $env:GITHUB_WORKSPACE 'theme-t07-save-load'
          $suite = '${{ matrix.suite }}'
          $entry = '.\validation-theme-t07-save-load.cjs'
          $env:RESUME_STUDIO_LIST_MODE = $suite
          if (!(Test-Path -LiteralPath $entry -PathType Leaf)) { throw 'Missing exact validation entrypoint' }
          node --check $entry
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          try {
            & .\node_modules\.bin\electron.cmd $entry
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item -LiteralPath $env:RESUME_STUDIO_DATA_DIR -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: theme-t07-${{ matrix.suite }}
          path: theme-t07-save-load/
          if-no-files-found: error
          retention-days: 3
