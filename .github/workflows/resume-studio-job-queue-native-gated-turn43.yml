name: Resume Studio Turn43 actual Electron execution and cold recovery
on:
  push:
    branches: ['resume-studio/v6-job-queue-final-gated-turn43']
permissions:
  contents: read
jobs:
  actual-execution:
    runs-on: windows-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: resume-studio-validation/app
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked dependencies
        timeout-minutes: 4
        run: |
          npm install --global pnpm@10.30.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build actual Electron application
        timeout-minutes: 3
        run: |
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm desktop:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real desktop control, failure and actual timeout
        timeout-minutes: 5
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $env:RESUME_STUDIO_DATA_DIR = Join-Path $env:RUNNER_TEMP ('synthetic-queue-execution-' + [guid]::NewGuid().ToString())
          $env:RESUME_STUDIO_EVIDENCE_OUT = Join-Path $env:GITHUB_WORKSPACE 'queue-execution-evidence/control'
          $env:QUEUE_PHASE = 'control'
          & .\node_modules\.bin\electron.cmd .\validation-job-queue-execution.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Completion write fault and independent cold restart
        timeout-minutes: 5
        run: |
          $env:RESUME_STUDIO_DATA_DIR = Join-Path $env:RUNNER_TEMP ('synthetic-queue-execution-' + [guid]::NewGuid().ToString())
          $env:RESUME_STUDIO_EVIDENCE_OUT = Join-Path $env:GITHUB_WORKSPACE 'queue-execution-evidence/restart'
          $env:QUEUE_PHASE = 'interrupt'
          & .\node_modules\.bin\electron.cmd .\validation-job-queue-execution.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:QUEUE_PHASE = 'restart'
          & .\node_modules\.bin\electron.cmd .\validation-job-queue-execution.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload actual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: queue-execution-evidence
          path: queue-execution-evidence/
          if-no-files-found: warn
          retention-days: 3
