name: Resume Studio T16 strict paper-local native isolation final product
on:
  push:
    branches: ['resume-studio/theme-p3-t16-final']
permissions:
  contents: read
jobs:
  paper:
    strategy:
      fail-fast: false
      matrix:
        group: [classic, light, dark, highContrast]
    runs-on: windows-latest
    timeout-minutes: 16
    defaults:
      run:
        shell: pwsh
        working-directory: resume-studio-validation/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked dependencies
        timeout-minutes: 4
        run: |
          npm install --global pnpm@10.30.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build native app
        timeout-minutes: 3
        run: |
          pnpm desktop:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual page boundary selection and native exports, then cold restart
        timeout-minutes: 9
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $env:RESUME_STUDIO_DATA_DIR = Join-Path $env:RUNNER_TEMP ('synthetic-theme-t11-export-' + [guid]::NewGuid().ToString())
          $env:RESUME_STUDIO_EVIDENCE_OUT = Join-Path $env:GITHUB_WORKSPACE 'theme-t16-final-paper'
          $env:STUDIO_THEME_GROUP = '${{ matrix.group }}'
          $entry = '.\validation-theme-t14-paper.cjs'
          node .\validation-theme-t11-preflight.cjs $entry
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          try {
            $env:STUDIO_MATRIX_PHASE = 'main'
            & .\node_modules\.bin\electron.cmd $entry
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $env:STUDIO_MATRIX_PHASE = 'restart'
            & .\node_modules\.bin\electron.cmd $entry
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item -LiteralPath $env:RESUME_STUDIO_DATA_DIR -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Preserve raw native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: theme-t16-final-paper-${{ matrix.group }}
          path: theme-t16-final-paper/
          if-no-files-found: error
          retention-days: 3
