name: Resume Studio real synthetic quality exact candidate
on:
  push:
    branches: ['resume-studio/v6-ai-quality-turn31']
permissions:
  contents: read
jobs:
  real-evaluation:
    runs-on: windows-latest
    timeout-minutes: 11
    defaults:
      run:
        working-directory: resume-studio-validation/app
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked dependencies
        timeout-minutes: 4
        run: |
          npm install --global pnpm@10.30.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Strict typecheck and actual desktop build
        timeout-minutes: 3
        run: |
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm desktop:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec esbuild validation-live-ai-adapters.ts --bundle --platform=node --format=cjs --outfile=validation-live-ai-adapters.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bounded real synthetic evaluation
        timeout-minutes: 5
        env:
          RESUME_STUDIO_LIVE_KEY: ${{ secrets.DRRPSEEK }}
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $env:RESUME_STUDIO_DATA_DIR = Join-Path $env:RUNNER_TEMP ('synthetic-ai-eval-' + [guid]::NewGuid().ToString())
          $env:RESUME_STUDIO_EVIDENCE_OUT = Join-Path $env:GITHUB_WORKSPACE 'ai-live-evaluation'
          try {
            & .\node_modules\.bin\electron.cmd .\validation-live-ai-candidate.cjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item Env:RESUME_STUDIO_LIVE_KEY -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $env:RESUME_STUDIO_DATA_DIR -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Upload safe evaluation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-live-evaluation
          path: ai-live-evaluation/
          if-no-files-found: error
          retention-days: 3
