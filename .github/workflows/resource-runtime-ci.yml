name: Resource Runtime CI

on:
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'src/pdf_production_engine/runtime_smoke.py'
      - 'src/pdf_production_engine/resource_runner.py'
      - 'pyproject.toml'
      - '.github/workflows/resource-runtime-ci.yml'
      - 'AGENTS.md'
      - 'docs/STATELESS_HANDOFF.md'
      - 'docs/SEALED_PRIVATE_JOBS.md'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  full-resource-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install document/figure system runtime
        id: system_runtime
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            texlive-xetex \
            texlive-lang-chinese \
            texlive-latex-extra \
            texlive-pictures \
            texlive-science \
            fonts-noto-cjk \
            fonts-arphic-ukai \
            fonts-arphic-uming \
            fonts-wqy-zenhei \
            poppler-utils \
            fontconfig

      - name: Install engine
        id: engine_install
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run full generic resource runtime smoke
        id: runtime_smoke
        continue-on-error: true
        if: steps.system_runtime.outcome == 'success' && steps.engine_install.outcome == 'success'
        run: |
          rm -rf .runtime-smoke
          pdf-runtime-smoke --out .runtime-smoke

      - name: Enforce runtime evidence
        id: evidence_gate
        continue-on-error: true
        if: steps.runtime_smoke.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('.runtime-smoke/runtime-smoke.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['status'] == 'MACHINE_PASS'
          required = {
              'CJK-font-runtime','XeLaTeX','TikZ','PGFPlots','CircuiTikZ',
              'tkz-euclide','tikz-3dplot','pdftotext','pdftoppm',
              'PyMuPDF-preflight','PDFium-render','Pillow-contact-sheet'
          }
          assert required.issubset(set(data['capabilities']))
          assert data['pdf_qa']['page_count'] == data['pdf_qa']['rendered_page_count']
          print('PASS: full generic resource runtime is available')
          PY

      - name: Upload public runtime fixture evidence
        if: steps.evidence_gate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pdf-engine-resource-runtime-smoke
          path: .runtime-smoke/
          if-no-files-found: error
          retention-days: 7

      - name: Publish segmented runtime statuses
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SYSTEM_OUTCOME: ${{ steps.system_runtime.outcome }}
          ENGINE_OUTCOME: ${{ steps.engine_install.outcome }}
          SMOKE_OUTCOME: ${{ steps.runtime_smoke.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence_gate.outcome }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo, sha, token = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA'], os.environ['GH_TOKEN']
          pairs = [
              ('pdf-engine/runtime-system', os.environ.get('SYSTEM_OUTCOME','skipped')),
              ('pdf-engine/runtime-python', os.environ.get('ENGINE_OUTCOME','skipped')),
              ('pdf-engine/runtime-smoke', os.environ.get('SMOKE_OUTCOME','skipped')),
              ('pdf-engine/runtime-evidence', os.environ.get('EVIDENCE_OUTCOME','skipped')),
          ]
          def state(outcome):
              return 'success' if outcome == 'success' else 'failure'
          for context, outcome in pairs:
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/statuses/{sha}',
                  data=json.dumps({
                      'state': state(outcome),
                      'context': context,
                      'description': f'outcome={outcome}',
                  }).encode(),
                  headers={
                      'Authorization':f'Bearer {token}',
                      'Accept':'application/vnd.github+json',
                      'X-GitHub-Api-Version':'2022-11-28',
                      'Content-Type':'application/json',
                  },
                  method='POST',
              )
              with urllib.request.urlopen(req) as r:
                  assert r.status == 201
          overall = all(outcome == 'success' for _, outcome in pairs)
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/statuses/{sha}',
              data=json.dumps({
                  'state':'success' if overall else 'failure',
                  'context':'pdf-engine/resource-runtime',
                  'description':'all resource runtime stages passed' if overall else 'one or more runtime stages failed',
              }).encode(),
              headers={
                  'Authorization':f'Bearer {token}',
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28',
                  'Content-Type':'application/json',
              },
              method='POST',
          )
          with urllib.request.urlopen(req) as r:
              assert r.status == 201
          if not overall:
              raise SystemExit('resource runtime stage failure')
          PY
