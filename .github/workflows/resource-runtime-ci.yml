name: Resource Runtime CI

on:
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'src/pdf_production_engine/runtime_smoke.py'
      - 'src/pdf_production_engine/resource_runner.py'
      - 'pyproject.toml'
      - '.github/workflows/resource-runtime-ci.yml'
      - 'AGENTS.md'
      - 'docs/STATELESS_HANDOFF.md'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  full-resource-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install document/figure system runtime
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            texlive-xetex \
            texlive-lang-chinese \
            texlive-latex-extra \
            texlive-pictures \
            texlive-science \
            fonts-noto-cjk \
            fonts-arphic-ukai \
            fonts-arphic-uming \
            fonts-wqy-zenhei \
            poppler-utils \
            fontconfig

      - name: Install engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run full generic resource runtime smoke
        run: |
          rm -rf .runtime-smoke
          pdf-runtime-smoke --out .runtime-smoke

      - name: Enforce runtime evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('.runtime-smoke/runtime-smoke.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['status'] == 'MACHINE_PASS'
          required = {
              'CJK-font-runtime','XeLaTeX','TikZ','PGFPlots','CircuiTikZ',
              'tkz-euclide','tikz-3dplot','pdftotext','pdftoppm',
              'PyMuPDF-preflight','PDFium-render','Pillow-contact-sheet'
          }
          assert required.issubset(set(data['capabilities']))
          assert data['pdf_qa']['page_count'] == data['pdf_qa']['rendered_page_count']
          print('PASS: full generic resource runtime is available')
          PY

      - name: Upload public runtime fixture evidence
        uses: actions/upload-artifact@v4
        with:
          name: pdf-engine-resource-runtime-smoke
          path: .runtime-smoke/
          if-no-files-found: error
          retention-days: 7

      - name: Publish success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo, sha, token = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA'], os.environ['GH_TOKEN']
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/statuses/{sha}',
              data=json.dumps({
                  'state':'success',
                  'context':'pdf-engine/resource-runtime',
                  'description':'TeX/TikZ/Poppler/CJK/render runtime passed',
              }).encode(),
              headers={
                  'Authorization':f'Bearer {token}',
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28',
                  'Content-Type':'application/json',
              },
              method='POST',
          )
          with urllib.request.urlopen(req) as r:
              assert r.status == 201
          PY

      - name: Publish failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo, sha, token = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA'], os.environ['GH_TOKEN']
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/statuses/{sha}',
              data=json.dumps({
                  'state':'failure',
                  'context':'pdf-engine/resource-runtime',
                  'description':'Generic resource runtime failed; inspect workflow logs',
              }).encode(),
              headers={
                  'Authorization':f'Bearer {token}',
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28',
                  'Content-Type':'application/json',
              },
              method='POST',
          )
          with urllib.request.urlopen(req) as r:
              assert r.status == 201
          PY
