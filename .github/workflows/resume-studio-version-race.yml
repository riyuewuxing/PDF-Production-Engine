name: Resume Studio actual export version race evidence
on:
  push:
    branches: ['resume-studio/v6-export-version-race-turn30']
permissions:
  contents: read
jobs:
  version-race:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: resume-studio-validation/app
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned dependencies
        timeout-minutes: 4
        run: |
          npm install --global pnpm@10.30.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build actual desktop
        timeout-minutes: 3
        run: |
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm desktop:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual editor switch during delayed managed export
        timeout-minutes: 3
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $env:RESUME_STUDIO_DATA_DIR = Join-Path $env:RUNNER_TEMP ('synthetic-version-race-' + [guid]::NewGuid().ToString())
          $env:RESUME_STUDIO_EVIDENCE_OUT = Join-Path $env:GITHUB_WORKSPACE 'version-race'
          & .\node_modules\.bin\electron.cmd .\validation-version-race.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned PDF audit dependency
        timeout-minutes: 2
        run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.7
      - name: Audit actual PDF source and portrait identity
        timeout-minutes: 2
        run: python validation-version-race-audit.py --root (Join-Path $env:GITHUB_WORKSPACE 'version-race') --runner-sha $env:GITHUB_SHA
      - name: Upload actual version race evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: version-race
          path: version-race/
          if-no-files-found: error
          retention-days: 3
