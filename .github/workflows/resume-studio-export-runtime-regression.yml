name: Resume Studio V6 final export shared runtime recovery regression
on:
  push:
    branches: ['resume-studio/v6-export-runtime-regression']
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: resume-studio-validation/app
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned dependencies
        timeout-minutes: 4
        run: |
          npm install --global pnpm@10.30.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build actual Electron and MCP runtime
        timeout-minutes: 3
        run: pnpm desktop:build
      - name: Existing real MCP protocol regression
        timeout-minutes: 3
        run: |
          $env:RESUME_STUDIO_EVIDENCE_OUT = Join-Path $env:GITHUB_WORKSPACE 'resume-studio-export-runtime'
          node validation-mcp-transport.cjs candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Existing real MCP permission and revision checks
        timeout-minutes: 2
        run: |
          $env:RESUME_STUDIO_DATA_DIR = Join-Path $env:RUNNER_TEMP ('mcp-synthetic-' + [guid]::NewGuid().ToString())
          $env:RESUME_STUDIO_EVIDENCE_OUT = Join-Path $env:GITHUB_WORKSPACE 'resume-studio-export-runtime'
          node validation-mcp-process.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Existing synthetic forced termination and recovery
        if: runner.os == 'Windows'
        timeout-minutes: 3
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $env:RESUME_STUDIO_CRASH_OUT = Join-Path $env:GITHUB_WORKSPACE 'resume-studio-export-runtime\crash'
          node scripts/qa-crash-draft.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload real regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resume-studio-export-runtime-${{ matrix.os }}
          path: resume-studio-export-runtime/
          if-no-files-found: error
          retention-days: 3
