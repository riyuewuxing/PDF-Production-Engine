name: Resume Studio Turn44 workflow task isolation tests and regression
on:
  push:
    branches: ['resume-studio/v6-job-queue-workflow-tests-turn44']
permissions:
  contents: read
jobs:
  queue-validation:
    runs-on: windows-latest
    timeout-minutes: 16
    defaults:
      run:
        working-directory: resume-studio-validation/app
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked dependencies
        timeout-minutes: 4
        run: |
          npm install --global pnpm@10.30.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Typecheck and build
        timeout-minutes: 3
        run: |
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm desktop:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Full synthetic regression
        timeout-minutes: 3
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'job-queue-evidence'
          New-Item -ItemType Directory -Force $out | Out-Null
          pnpm exec vitest run --reporter=json --outputFile="$out/vitest.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual Windows queue and cold process restart
        timeout-minutes: 6
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $env:RESUME_STUDIO_DATA_DIR = Join-Path $env:RUNNER_TEMP ('synthetic-job-queue-' + [guid]::NewGuid().ToString())
          $env:RESUME_STUDIO_EVIDENCE_OUT = Join-Path $env:GITHUB_WORKSPACE 'job-queue-evidence/native'
          $env:QUEUE_PHASE = 'create'
          & .\node_modules\.bin\electron.cmd .\validation-job-queue.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:QUEUE_PHASE = 'reopen'
          & .\node_modules\.bin\electron.cmd .\validation-job-queue.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: job-queue-evidence
          path: job-queue-evidence/
          if-no-files-found: warn
          retention-days: 3
