name: Resume Studio T05 offline JD announcement and AI theme evidence
on:
  push:
    branches: ['resume-studio/theme-p1-t05-offline']
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        phase: [baseline, candidate]
    runs-on: windows-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh
        working-directory: resume-studio-validation/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 5
      - name: Restore exact T04 source for baseline
        if: matrix.phase == 'baseline'
        working-directory: .
        timeout-minutes: 1
        run: |
          git fetch --no-tags --depth=1 origin ad2082aa3359bfcd0a28f5442ecbb6dafec4f727
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git restore --source=ad2082aa3359bfcd0a28f5442ecbb6dafec4f727 --worktree --staged -- resume-studio-validation/app/src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked dependencies
        timeout-minutes: 4
        run: |
          npm install --global pnpm@10.30.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build actual desktop
        timeout-minutes: 3
        run: |
          pnpm desktop:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual offline JD import, original paper and AI configuration
        timeout-minutes: 5
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $env:RESUME_STUDIO_DATA_DIR = Join-Path $env:RUNNER_TEMP ('synthetic-theme-t05-' + [guid]::NewGuid().ToString())
          $env:RESUME_STUDIO_EVIDENCE_OUT = Join-Path $env:GITHUB_WORKSPACE 'theme-t05-offline'
          $env:STUDIO_THEME_PHASE = '${{ matrix.phase }}'
          try {
            & .\node_modules\.bin\electron.cmd .\validation-theme-t05-offline.cjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item -LiteralPath $env:RESUME_STUDIO_DATA_DIR -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Upload actual offline evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: theme-t05-offline-${{ matrix.phase }}
          path: theme-t05-offline/
          if-no-files-found: error
          retention-days: 3
