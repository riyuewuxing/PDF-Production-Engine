name: Resume Studio T13 native independent component skins
on:
  push:
    branches: ['resume-studio/theme-p3-t13-candidate']
permissions:
  contents: read
jobs:
  skins:
    strategy:
      fail-fast: false
      matrix:
        theme: [classic, light, dark, highContrast]
    runs-on: windows-latest
    timeout-minutes: 16
    defaults:
      run:
        shell: pwsh
        working-directory: resume-studio-validation/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked dependencies
        timeout-minutes: 4
        run: |
          npm install --global pnpm@10.30.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Typecheck and complete regression
        if: matrix.theme == 'classic'
        timeout-minutes: 4
        run: |
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build native app
        timeout-minutes: 3
        run: |
          pnpm desktop:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native modal keyboard pointer and persistence gates
        timeout-minutes: 8
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $env:RESUME_STUDIO_DATA_DIR = Join-Path $env:RUNNER_TEMP ('synthetic-t13-skins-' + [guid]::NewGuid().ToString())
          $env:RESUME_STUDIO_EVIDENCE_OUT = Join-Path $env:GITHUB_WORKSPACE 'theme-t13-skins'
          $env:STUDIO_SKIN_THEME = '${{ matrix.theme }}'
          $entry = '.\validation-theme-t13-skins.cjs'
          node .\validation-theme-t11-preflight.cjs $entry
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          try {
            $env:STUDIO_SKIN_PHASE='main'
            & .\node_modules\.bin\electron.cmd $entry
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $env:STUDIO_SKIN_PHASE='restart'
            & .\node_modules\.bin\electron.cmd $entry
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item -LiteralPath $env:RESUME_STUDIO_DATA_DIR -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: theme-t13-skins-${{ matrix.theme }}
          path: theme-t13-skins/
          if-no-files-found: warn
          retention-days: 3
