name: Resume Studio T03 all 51 live gallery thumbnails
on:
  push:
    branches: ['resume-studio/theme-p1-t03-gallery-matrix']
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        phase: [candidate]
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: resume-studio-validation/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 10
      - name: Restore exact old source for baseline only
        if: matrix.phase == 'baseline'
        working-directory: .
        timeout-minutes: 1
        run: |
          git restore --source=7d66321ddbf1cbcf3d37a3f202d4ee095ba33453 --worktree --staged -- resume-studio-validation/app/src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked dependencies
        timeout-minutes: 4
        run: |
          npm install --global pnpm@10.30.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build actual Electron app
        timeout-minutes: 3
        run: |
          pnpm desktop:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Full registry actual thumbnail rendering and pixel evidence
        timeout-minutes: 7
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $env:RESUME_STUDIO_DATA_DIR = Join-Path $env:RUNNER_TEMP ('studio-theme-t03-' + [guid]::NewGuid().ToString())
          $env:RESUME_STUDIO_EVIDENCE_OUT = Join-Path $env:GITHUB_WORKSPACE 'theme-t03-gallery-matrix'
          $env:STUDIO_THEME_PHASE = '${{ matrix.phase }}'
          & .\node_modules\.bin\electron.cmd .\validation-theme-gallery-matrix.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload raw screenshots and native exports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: theme-t03-gallery-matrix-${{ matrix.phase }}
          path: theme-t03-gallery-matrix/
          if-no-files-found: error
          retention-days: 3
