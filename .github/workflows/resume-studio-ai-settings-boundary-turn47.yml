name: Resume Studio T47 AI MCP and offline fixed-source audit
on:
  push:
    branches: ['resume-studio/v6-ai-settings-boundary-turn47']
permissions:
  contents: read
jobs:
  settings:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: resume-studio-validation/app
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked dependencies
        timeout-minutes: 4
        run: |
          npm install --global pnpm@10.30.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Strict typecheck and build
        timeout-minutes: 3
        run: |
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec vitest --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Credential file and concurrent instance tests
        timeout-minutes: 3
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 't47-evidence'
          New-Item -ItemType Directory -Force $out | Out-Null
          pnpm exec vitest run electron/aiSettingsStore.test.ts --reporter=json --outputFile="$out/settings.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t47-settings-${{ matrix.os }}
          path: t47-evidence/
          if-no-files-found: error
          retention-days: 3
