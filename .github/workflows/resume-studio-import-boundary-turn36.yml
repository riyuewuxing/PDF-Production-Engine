name: Resume Studio import exact file limits and export boundary
on:
  push:
    branches: ['resume-studio/v6-import-boundary-turn36']
permissions:
  contents: read
jobs:
  windows-import-boundary:
    runs-on: windows-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: resume-studio-validation/app
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Locked install
        timeout-minutes: 4
        run: |
          npm install --global pnpm@10.30.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build actual app
        timeout-minutes: 3
        run: pnpm desktop:build
      - name: Native import and four actual export artifacts
        timeout-minutes: 4
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $env:RESUME_STUDIO_DATA_DIR = Join-Path $env:RUNNER_TEMP ('synthetic-import-boundary-' + [guid]::NewGuid().ToString())
          $env:RESUME_STUDIO_EVIDENCE_OUT = Join-Path $env:GITHUB_WORKSPACE 'import-boundary-evidence'
          & .\node_modules\.bin\electron.cmd .\validation-local-text-import-boundary.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned PDF audit dependency
        timeout-minutes: 2
        run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.7
      - name: Independently audit actual files and render PDF
        timeout-minutes: 1
        run: python validation-import-export-audit.py --root (Join-Path $env:GITHUB_WORKSPACE 'import-boundary-evidence') --runner-sha $env:GITHUB_SHA
      - name: Upload actual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: import-boundary-evidence
          path: import-boundary-evidence/
          if-no-files-found: ignore
          retention-days: 3
