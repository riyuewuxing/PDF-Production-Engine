name: Teaching Demo Synthetic Block Acceptance

on:
  push:
    branches:
      - 'job-teaching-demo/synthetic-preflight-v1'
    paths:
      - '.engine-job/run-block-acceptance.flag'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  block-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout public Engine package
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lightweight runtime dependency
        run: python -m pip install 'PyYAML>=6,<7'

      - name: Recover exact prior INPUTS_LOCKED writeback
        uses: actions/download-artifact@v4
        with:
          name: teaching-demo-artifact-plan-lock-machine-evidence
          path: .engine-job/prior
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32844323031

      - name: Apply ChatGPT-reviewed synthetic blocks and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil, subprocess, traceback, yaml

          root = Path('.engine-job/teaching-demo-synthetic-repo').resolve()
          prior = Path('.engine-job/prior/writeback').resolve()
          out = Path('.engine-job/output').resolve()
          shutil.rmtree(out, ignore_errors=True)
          (out / 'writeback').mkdir(parents=True, exist_ok=True)

          job_rel = 'qa/fixtures/teaching-demo-synthetic-v1/artifact-job.yaml'
          ledger_rel = 'qa/fixtures/teaching-demo-synthetic-v1/execution-ledger.yaml'
          plan_rel = 'production/teaching-demo-artifact-plans/synthetic-structure-v1/405fdcd25c1b14b816208451d89bfaf9c1ad4a650c426e7571082909845aa224.yaml'
          snapshot_rel = 'production/provenance/repository-snapshots/13895002cff0d76d98a5b81d5211272c464134bb2bed5bc4b3395bde28566a2a.yaml'

          review_blocks = [
              ('source-boundary',
               'qa/fixtures/teaching-demo-synthetic-v1/block-review/source-boundary.artifact.yaml',
               'qa/fixtures/teaching-demo-synthetic-v1/block-review/source-boundary.review.yaml'),
              ('board-skeleton',
               'qa/fixtures/teaching-demo-synthetic-v1/block-review/board-skeleton.artifact.yaml',
               'qa/fixtures/teaching-demo-synthetic-v1/block-review/board-skeleton.review.yaml'),
              ('trial-script',
               'qa/fixtures/teaching-demo-synthetic-v1/block-review/trial-script.artifact.yaml',
               'qa/fixtures/teaching-demo-synthetic-v1/block-review/trial-script.review.yaml'),
              ('support-materials',
               'qa/fixtures/teaching-demo-synthetic-v1/block-review/support-materials.artifact.yaml',
               'qa/fixtures/teaching-demo-synthetic-v1/block-review/support-materials.review.yaml'),
          ]

          evidence = {
              'version': 1,
              'kind': 'qiuzhidaren-teaching-demo-synthetic-block-acceptance-machine-evidence',
              'status': 'MACHINE_FAIL',
              'review_status': 'REVIEW_REQUIRED',
              'synthetic_fixture': True,
              'prior_engine_run_id': 32844323031,
              'prior_artifact_state': 'INPUTS_LOCKED',
              'human_block_reviewer': 'ChatGPT',
              'engine_decided_human_review': False,
              'product_pdf_generated': False,
              'human_delivery_acceptance_performed': False,
              'publication_performed': False,
              'system_qualification_performed': False,
          }

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def run(cmd):
              proc = subprocess.run(cmd, cwd=root, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              print(proc.stdout, end='')
              if proc.returncode:
                  raise RuntimeError(f'command failed {cmd!r}: exit={proc.returncode}: {proc.stdout[-4000:]}')
              return {'command': cmd, 'exit_code': proc.returncode, 'output': proc.stdout[-8000:]}

          try:
              for rel in (job_rel, ledger_rel, plan_rel, snapshot_rel):
                  src = prior / rel
                  dst = root / rel
                  if not src.is_file():
                      raise FileNotFoundError(f'prior writeback missing: {rel}')
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dst)

              job_before = yaml.safe_load((root / job_rel).read_text(encoding='utf-8')) or {}
              ledger_before = yaml.safe_load((root / ledger_rel).read_text(encoding='utf-8')) or {}
              if job_before.get('state') != 'INPUTS_LOCKED':
                  raise ValueError('prior job is not INPUTS_LOCKED')
              if (ledger_before.get('derived') or {}).get('artifact_state') != 'INPUTS_LOCKED':
                  raise ValueError('prior ledger projection is not INPUTS_LOCKED')

              reviewed = []
              commands = []
              for block_id, artifact_rel, review_rel in review_blocks:
                  artifact = root / artifact_rel
                  review = root / review_rel
                  if not artifact.is_file() or not review.is_file():
                      raise FileNotFoundError(f'block review files missing: {block_id}')
                  review_data = yaml.safe_load(review.read_text(encoding='utf-8')) or {}
                  if review_data.get('reviewer') != 'ChatGPT' or review_data.get('review_state') != 'REVIEW_PASS':
                      raise ValueError(f'block lacks explicit ChatGPT REVIEW_PASS: {block_id}')
                  if review_data.get('block_id') != block_id or review_data.get('synthetic_fixture') is not True:
                      raise ValueError(f'block review identity mismatch: {block_id}')
                  commands.append(run([
                      'python', 'tools/manage_artifact_job.py', 'accept-block',
                      '--job', job_rel,
                      '--block-id', block_id,
                      '--artifact', f'{artifact_rel}=content_block_manifest',
                      '--evidence', f'{review_rel}=human_block_review_evidence',
                  ]))
                  reviewed.append({
                      'block_id': block_id,
                      'artifact_path': artifact_rel,
                      'artifact_sha256': sha256(artifact),
                      'review_path': review_rel,
                      'review_sha256': sha256(review),
                  })

              commands.append(run(['python', 'tools/manage_artifact_job.py', 'advance', '--job', job_rel, '--to', 'BLOCKS_ACCEPTED']))
              commands.append(run(['python', 'tools/check_artifact_job.py', '--job', job_rel]))
              commands.append(run(['python', 'tools/check_execution_ledger.py', '--ledger', ledger_rel, '--report']))

              job = yaml.safe_load((root / job_rel).read_text(encoding='utf-8')) or {}
              ledger = yaml.safe_load((root / ledger_rel).read_text(encoding='utf-8')) or {}
              derived = ledger.get('derived') or {}
              block_ids = [x.get('block_id') for x in (job.get('blocks') or []) if isinstance(x, dict)]
              expected_ids = [x[0] for x in review_blocks]
              if job.get('state') != 'BLOCKS_ACCEPTED' or derived.get('artifact_state') != 'BLOCKS_ACCEPTED':
                  raise ValueError('job/ledger did not reach BLOCKS_ACCEPTED')
              if block_ids != expected_ids:
                  raise ValueError(f'block receipt order/set mismatch: {block_ids!r}')
              if any((x.get('state'), x.get('reviewer')) != ('REVIEW_PASS', 'ChatGPT') for x in job.get('blocks') or []):
                  raise ValueError('all accepted blocks must be ChatGPT REVIEW_PASS')
              for key in ('generation_review_cycles', 'build_count', 'final_render_count', 'review_reject_count'):
                  if derived.get(key) != 0:
                      raise ValueError(f'no-build phase metric must remain zero: {key}={derived.get(key)!r}')
              if job.get('outputs') or job.get('machine_evidence'):
                  raise ValueError('BLOCKS_ACCEPTED no-PDF phase must not contain outputs/machine evidence')
              if (job.get('human_acceptance') or {}).get('state') != 'PENDING':
                  raise ValueError('delivery HUMAN acceptance must remain pending')
              if (job.get('publication') or {}).get('state') != 'NOT_PUBLISHED':
                  raise ValueError('publication must remain NOT_PUBLISHED')
              pdfs = sorted(p.relative_to(root).as_posix() for p in root.rglob('*.pdf'))
              if pdfs:
                  raise ValueError('product PDF present/generated in no-PDF block phase: ' + repr(pdfs))

              evidence.update({
                  'status': 'MACHINE_PASS',
                  'review_status': 'BLOCKS_REVIEW_PASS_BY_CHATGPT',
                  'accepted_block_ids': block_ids,
                  'accepted_blocks': reviewed,
                  'artifact_state': job.get('state'),
                  'ledger_projection': derived,
                  'input_fingerprint': (job.get('build_provenance') or {}).get('input_fingerprint'),
                  'commands': commands,
              })

              for rel in (job_rel, ledger_rel):
                  src = root / rel
                  dst = out / 'writeback' / rel
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dst)
          except Exception as exc:
              evidence['error'] = f'{type(exc).__name__}: {exc}'
              evidence['traceback'] = traceback.format_exc()[-16000:]
          finally:
              (out / 'teaching-demo-synthetic-block-acceptance-evidence.json').write_text(
                  json.dumps(evidence, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              print(json.dumps(evidence, ensure_ascii=False, indent=2))

          if evidence.get('status') != 'MACHINE_PASS':
              raise SystemExit('Teaching Demo synthetic block acceptance MACHINE_FAIL')
          PY

      - name: Upload block acceptance machine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teaching-demo-synthetic-block-acceptance-machine-evidence
          path: .engine-job/output/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
