name: Resume Studio T09 crop safety and native zoom
on:
  push:
    branches: ['resume-studio/theme-p1-t09-safety']
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        suite: [safety]
    runs-on: windows-latest
    timeout-minutes: 14
    defaults:
      run:
        shell: pwsh
        working-directory: resume-studio-validation/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked dependencies
        timeout-minutes: 4
        run: |
          npm install --global pnpm@10.30.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Typecheck and actual desktop build
        timeout-minutes: 3
        run: |
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm desktop:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual native operation and four-theme matrix
        timeout-minutes: 6
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $suite = '${{ matrix.suite }}'
          $prefix = switch ($suite) { 'workflow' { 'synthetic-queue-workflow-' } 'interview' { 'synthetic-interview-' } 'ai' { 'synthetic-ai-receipts-' } default { 'synthetic-crop-safety-' } }
          $env:RESUME_STUDIO_DATA_DIR = Join-Path $env:RUNNER_TEMP ($prefix + [guid]::NewGuid().ToString())
          $env:RESUME_STUDIO_EVIDENCE_OUT = Join-Path $env:GITHUB_WORKSPACE 'theme-t09-safety'
          $entry = '.\validation-theme-t09-safety.cjs'
          foreach ($file in @($entry, '.\validation-theme-t05-contrast.cjs')) {
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing $file" }
            node --check $file
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          try {
            if ($suite -eq 'workflow') { $env:QUEUE_PHASE='main' }
            & .\node_modules\.bin\electron.cmd $entry
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($suite -eq 'workflow') {
              $env:QUEUE_PHASE='restart'
              & .\node_modules\.bin\electron.cmd $entry
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          } finally {
            Remove-Item -LiteralPath $env:RESUME_STUDIO_DATA_DIR -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: theme-t09-safety
          path: theme-t09-safety/
          if-no-files-found: error
          retention-days: 3
