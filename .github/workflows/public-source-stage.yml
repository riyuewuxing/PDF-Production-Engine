name: Public Source Stage

on:
  push:
    branches:
      - 'job-public/**'
    paths:
      - '.engine-job/**'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  locked-source:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout engine and public stage package
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Validate public-only stage boundary
        run: |
          test -f .engine-job/locked-source.yaml
          python - <<'PY'
          from pathlib import Path
          import yaml
          p = Path('.engine-job/locked-source.yaml')
          data = yaml.safe_load(p.read_text(encoding='utf-8')) or {}
          urls = data.get('urls') or []
          assert urls and all(isinstance(x, str) and x.startswith('https://') for x in urls)
          assert (data.get('expected') or {}).get('git_blob_sha') or (data.get('expected') or {}).get('sha256')
          print('PASS: public locked-source stage package boundary')
          PY

      - name: Fetch, verify and extract selected pages
        run: |
          rm -rf .engine-job/output
          pdf-locked-pages --spec .engine-job/locked-source.yaml --out .engine-job/output

      - name: Preflight and render every extracted page at 200 dpi
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pdf_production_engine.cli import preflight_and_render
          out = Path('.engine-job/output')
          pdf = out / 'selected-pages.pdf'
          qa = preflight_and_render(pdf, out / 'rendered', 200)
          assert qa['page_count'] == qa['rendered_page_count']
          (out / 'render-evidence.json').write_text(
              json.dumps({'status':'MACHINE_PASS','review_status':'REVIEW_REQUIRED','qa':qa}, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(f"PASS: rendered {qa['page_count']} extracted pages at 200 dpi")
          PY

      - name: Upload public source-stage evidence
        uses: actions/upload-artifact@v4
        with:
          name: public-source-stage
          path: .engine-job/output/
          if-no-files-found: error
          retention-days: 7

      - name: Publish success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']
          token = os.environ['GH_TOKEN']
          run_id = os.environ['GITHUB_RUN_ID']
          def publish(context, description):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/statuses/{sha}",
                  data=json.dumps({'state':'success','context':context,'description':description}).encode(),
                  headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},
                  method='POST',
              )
              with urllib.request.urlopen(req) as r:
                  assert r.status == 201
          publish('pdf-engine/public-source-stage', 'Locked public source verified, extracted and rendered')
          publish(f'pdf-engine/public-source-stage/run-{run_id}', 'Machine-readable workflow run id')
          PY

      - name: Publish failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']
          token = os.environ['GH_TOKEN']
          run_id = os.environ['GITHUB_RUN_ID']
          for context, description in [
              ('pdf-engine/public-source-stage', 'Public source stage failed; inspect workflow logs'),
              (f'pdf-engine/public-source-stage/run-{run_id}', 'Machine-readable failed workflow run id'),
          ]:
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/statuses/{sha}",
                  data=json.dumps({'state':'failure','context':context,'description':description}).encode(),
                  headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},
                  method='POST',
              )
              with urllib.request.urlopen(req) as r:
                  assert r.status == 201
          PY
