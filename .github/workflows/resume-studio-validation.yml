name: Resume Studio V6 isolated validation
on:
  push:
    branches: ['resume-studio/v6-validation']
    paths: ['resume-studio-validation/**', '.github/workflows/resume-studio-validation.yml']
permissions:
  contents: read
concurrency:
  group: resume-studio-v6-validation
  cancel-in-progress: true
jobs:
  windows-application:
    runs-on: windows-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: resume-studio-validation/app
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: |
          npm install --global pnpm@10.30.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Typecheck audited runtime
        run: pnpm typecheck
      - name: Targeted V6 regression tests
        run: pnpm exec vitest run src/hooks/useResumePersistence.test.tsx src/lib/aiTailor.test.ts electron/aiSettingsStore.test.ts src/mcp/mcpHandlers.test.ts src/server/localFsApi.test.ts src/server/revisionConcurrency.test.ts electron/securityPolicy.test.ts src/lib/careerExporter.test.ts src/lib/jsonResumeAdapter.test.ts src/server/recycleBin.test.ts src/server/lockAndLedger.test.ts src/lib/careerLedgerSession.test.ts src/lib/byokAiClient.test.ts src/lib/careerAi.test.ts src/lib/aiTextPatch.test.ts src/lib/jobToolkitSynthetic.test.ts src/lib/aiLayout.test.ts src/server/factBankStore.test.ts src/lib/factSelection.test.ts src/lib/aiWorkflow.test.ts src/server/evidenceStore.test.ts scripts/private-evidence-paths.test.mjs
      - name: Build actual Electron application
        run: pnpm desktop:build
      - name: Run real application with synthetic fixture and failure injection
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $env:RESUME_STUDIO_DATA_DIR = Join-Path $env:RUNNER_TEMP 'resume-studio-v6-synthetic'
          $env:RESUME_STUDIO_EVIDENCE_OUT = Join-Path $env:GITHUB_WORKSPACE 'resume-studio-evidence'
          & .\node_modules\.bin\electron.cmd .\validation-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload synthetic application evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resume-studio-application-evidence
          path: resume-studio-evidence/
          if-no-files-found: ignore
          retention-days: 3


  pagination-matrix:
    runs-on: windows-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - locale: zh-CN
            modes: natural
            suite: natural
          - locale: en-US
            modes: natural
            suite: natural
          - locale: zh-CN
            modes: compact,extended
            suite: legacy
          - locale: en-US
            modes: compact,extended
            suite: legacy
          - locale: zh-CN
            modes: contacts
            suite: contacts
          - locale: en-US
            modes: contacts
            suite: contacts
    defaults:
      run:
        working-directory: resume-studio-validation/app
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: |
          npm install --global pnpm@10.30.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build actual Electron application
        run: pnpm desktop:build
      - name: Render actual template matrix
        env:
          RESUME_MATRIX_LOCALE: ${{ matrix.locale }}
          RESUME_MATRIX_MODES: ${{ matrix.modes }}
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $env:RESUME_MATRIX_SOURCE_SHA = (Get-Content runner-manifest.json -Raw | ConvertFrom-Json).sourceSha
          $env:RESUME_MATRIX_OUT = Join-Path $env:GITHUB_WORKSPACE 'natural-matrix'
          & .\node_modules\.bin\electron.cmd .\scripts\qa-template-matrix.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned PDF audit dependency
        timeout-minutes: 2
        run: |
          python -m pip install --disable-pip-version-check PyMuPDF==1.26.7
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Audit actual PDF output
        timeout-minutes: 2
        run: |
          $source = (Get-Content runner-manifest.json -Raw | ConvertFrom-Json).sourceSha
          python scripts/qa-audit-template-matrix.py --root (Join-Path $env:GITHUB_WORKSPACE 'natural-matrix') --locale '${{ matrix.locale }}' --modes '${{ matrix.modes }}' --source-sha $source --runner-sha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload PDF matrix and audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pagination-${{ matrix.suite }}-${{ matrix.locale }}
          path: natural-matrix/
          if-no-files-found: error
          retention-days: 3
