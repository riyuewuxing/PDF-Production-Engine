name: Resume Studio T47 cross-process credential and malformed MCP stdio gate
on:
  push:
    branches: ['resume-studio/v6-ai-mcp-process-gate-turn47']
permissions:
  contents: read
jobs:
  process-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    defaults:
      run:
        working-directory: resume-studio-validation/app
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked dependencies
        timeout-minutes: 4
        run: |
          npm install --global pnpm@10.30.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Strict typecheck and build
        timeout-minutes: 3
        run: |
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec esbuild scripts/mcp-server.ts --bundle --platform=node --format=cjs --outfile=dist-electron/mcp-server.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual cross-process credential serialization and lock deadline
        timeout-minutes: 3
        run: |
          pnpm exec esbuild validation-t47-credential-process.ts --bundle --platform=node --format=cjs --outfile=validation-t47-credential-process.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:RESUME_STUDIO_DATA_DIR = Join-Path $env:RUNNER_TEMP ('synthetic-t47-process-' + [guid]::NewGuid().ToString())
          $env:RESUME_STUDIO_EVIDENCE_OUT = Join-Path $env:GITHUB_WORKSPACE 't47-process'
          node validation-t47-credential-process.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual MCP transport with guarded network and malformed envelopes
        timeout-minutes: 3
        run: |
          $env:RESUME_STUDIO_EVIDENCE_OUT = Join-Path $env:GITHUB_WORKSPACE 't47-process'
          node validation-mcp-transport.cjs candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t47-process-${{ matrix.os }}
          path: t47-process/
          if-no-files-found: error
          retention-days: 3
