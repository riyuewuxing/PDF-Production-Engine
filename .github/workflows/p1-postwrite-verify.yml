name: P1 Postwrite Verification

on:
  push:
    branches:
      - 'job-architecture/p1-state-derivation-*'
    paths:
      - '.engine-input/p1-postwrite/**'
      - '.github/workflows/p1-postwrite-verify.yml'

permissions:
  contents: write

jobs:
  verify-committed-views:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml

      - name: Verify exact committed views and run check-only gate
        id: execute
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, shutil, subprocess, time, traceback

          checkout=Path.cwd().resolve()
          base=checkout/'.engine-input/p1-actual/repo'
          overlay=checkout/'.engine-input/p1-postwrite'
          generic=checkout/'.engine-job/p1-state-derivation/repo'
          work=checkout/'.engine-job/p1-postwrite/work'
          out=checkout/'.engine-job/p1-postwrite/output'
          pkg=json.loads((overlay/'manifest.json').read_text(encoding='utf-8'))

          if work.exists():
              shutil.rmtree(work)
          shutil.copytree(base,work)
          (work/'tools').mkdir(parents=True,exist_ok=True)
          for name in ['artifact_foundation.py','derive_state.py','gen_handoff.py','check_state_derivation.py']:
              shutil.copy2(generic/'tools'/name,work/'tools'/name)

          evidence={
            'version':1,
            'kind':'qiuzhidaren-p1-postwrite-verification-evidence-v1',
            'status':'MACHINE_FAIL',
            'source_repository':pkg['source_repository'],
            'source_commit':pkg['source_commit'],
            'engine_repository':os.environ.get('GITHUB_REPOSITORY'),
            'engine_execution_commit':os.environ.get('GITHUB_SHA'),
            'engine_run_id':os.environ.get('GITHUB_RUN_ID'),
            'execution_surface':'public-engine-github-hosted-runner',
            'private_repository_access_used':False,
            'private_repository_credentials_used':False,
            'product_pdf_generated':False
          }

          def blob_sha(data):
              return hashlib.sha1(f'blob {len(data)}\0'.encode('ascii')+data).hexdigest()

          try:
              if pkg.get('privacy') != 'public-nonsecret-metadata-only':
                  raise ValueError('privacy boundary invalid')
              verified=[]
              for item in pkg['views']:
                  src=(overlay/'views'/item['path']).resolve()
                  data=src.read_bytes()
                  actual=blob_sha(data)
                  if actual != item['git_blob_sha1']:
                      raise ValueError(f'view blob mismatch: {item["path"]}')
                  verified.append({'path':item['path'],'git_blob_sha1':actual,'sha256':hashlib.sha256(data).hexdigest()})
                  dest=work/item['path']
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(data)
              if len(verified) != pkg['expected_view_count']:
                  raise ValueError('view count drift')

              started=time.monotonic()
              proc=subprocess.run(
                  ['python','tools/check_state_derivation.py','--root','.'],
                  cwd=work,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT
              )
              output=proc.stdout or ''
              print(output,end='')
              pdfs=[p.relative_to(work).as_posix() for p in work.rglob('*.pdf')]
              evidence.update({
                  'status':'MACHINE_PASS' if proc.returncode==0 and not pdfs else 'MACHINE_FAIL',
                  'verified_view_count':len(verified),
                  'verified_views':verified,
                  'command':['python','tools/check_state_derivation.py','--root','.'],
                  'exit_code':proc.returncode,
                  'duration_seconds':round(time.monotonic()-started,6),
                  'output_tail':output[-12000:],
                  'product_pdf_generated':bool(pdfs),
                  'product_pdf_paths':pdfs,
                  'runtime':{'os':os.environ.get('RUNNER_OS'),'python':os.sys.version.split()[0]}
              })
          except Exception as exc:
              evidence['error']=f'{type(exc).__name__}: {exc}'
              evidence['traceback']=traceback.format_exc()[-12000:]
          finally:
              out.mkdir(parents=True,exist_ok=True)
              (out/'p1-postwrite-verification-evidence.json').write_text(
                  json.dumps(evidence,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
              )
              print(json.dumps(evidence,ensure_ascii=False,indent=2))

          if evidence.get('status') != 'MACHINE_PASS':
              raise SystemExit('P1 postwrite verification MACHINE_FAIL')
          PY

      - name: Commit postwrite evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git clean -fd .engine-job/p1-postwrite/work
          git add .engine-job/p1-postwrite/output/p1-postwrite-verification-evidence.json
          if ! git diff --cached --quiet; then
            git commit -m 'job: record P1 postwrite verification'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Enforce postwrite result
        if: always()
        run: test '${{ steps.execute.outcome }}' = 'success'
