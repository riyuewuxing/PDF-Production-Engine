name: Resume Studio T10 new palette keyboard recovery and dialog gates
on:
  push:
    branches: ['resume-studio/theme-p2-t10-safety']
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        suite: [command, mixed, all-corrupt, version-comparison, local-text-import, local-docx-import]
    runs-on: windows-latest
    timeout-minutes: 14
    defaults:
      run:
        shell: pwsh
        working-directory: resume-studio-validation/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked dependencies
        timeout-minutes: 4
        run: |
          npm install --global pnpm@10.30.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Typecheck and actual desktop build
        timeout-minutes: 3
        run: |
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm desktop:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual native operation and five-theme matrix
        timeout-minutes: 6
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $env:RESUME_STUDIO_DATA_DIR = Join-Path $env:RUNNER_TEMP ('synthetic-list-' + [guid]::NewGuid().ToString())
          $env:RESUME_STUDIO_EVIDENCE_OUT = Join-Path $env:GITHUB_WORKSPACE 'theme-t10-safety'
          $suite = '${{ matrix.suite }}'
          $entry = if ($suite -eq 'command') { '.\validation-theme-t07-command.cjs' } else { '.\validation-theme-t07-recovery.cjs' }
          if ($suite -in @('version-comparison','local-text-import','local-docx-import')) {
            $env:RESUME_STUDIO_DATA_DIR = Join-Path $env:RUNNER_TEMP ('synthetic-theme-t06-' + [guid]::NewGuid().ToString())
            $entry = ".\validation-$suite-t06.cjs"
          }
          $env:RESUME_STUDIO_LIST_MODE = $suite
          if (!(Test-Path -LiteralPath $entry -PathType Leaf)) { throw 'Missing exact validation entrypoint' }
          node --check $entry
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          try {
            & .\node_modules\.bin\electron.cmd $entry
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item -LiteralPath $env:RESUME_STUDIO_DATA_DIR -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: theme-t10-safety-${{ matrix.suite }}
          path: theme-t10-safety/
          if-no-files-found: error
          retention-days: 3
