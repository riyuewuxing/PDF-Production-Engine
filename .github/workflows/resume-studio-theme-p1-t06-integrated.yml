name: Resume Studio T06 integrated full regression and exports
on:
  push:
    branches: ['resume-studio/theme-p1-t06-integrated']
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        phase: [baseline, candidate]
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: resume-studio-validation/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 10
      - name: Restore exact old source for baseline only
        if: matrix.phase == 'baseline'
        working-directory: .
        timeout-minutes: 2
        run: |
          git fetch --no-tags --depth=1 origin aa41875eee5b32a79150fce2c6bdd5f770432ddf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git restore --source=aa41875eee5b32a79150fce2c6bdd5f770432ddf --worktree --staged -- resume-studio-validation/app/src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked dependencies
        timeout-minutes: 4
        run: |
          npm install --global pnpm@10.30.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Typecheck and full regression (candidate)
        if: matrix.phase == 'candidate'
        timeout-minutes: 4
        run: |
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build actual Electron app
        timeout-minutes: 3
        run: |
          pnpm desktop:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real desktop theme and document export evidence
        timeout-minutes: 6
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $env:RESUME_STUDIO_DATA_DIR = Join-Path $env:RUNNER_TEMP ('studio-theme-t03-' + [guid]::NewGuid().ToString())
          $env:RESUME_STUDIO_EVIDENCE_OUT = Join-Path $env:GITHUB_WORKSPACE 'theme-t06-regression-evidence'
          $env:STUDIO_THEME_PHASE = '${{ matrix.phase }}'
          if (!(Test-Path -LiteralPath '.\validation-theme-p3.cjs' -PathType Leaf)) { throw 'Missing exact validation entrypoint' }
          node --check .\validation-theme-p3.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\node_modules\.bin\electron.cmd .\validation-theme-p3.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload raw screenshots and native exports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: theme-t06-regression-${{ matrix.phase }}
          path: theme-t06-regression-evidence/
          if-no-files-found: error
          retention-days: 3
