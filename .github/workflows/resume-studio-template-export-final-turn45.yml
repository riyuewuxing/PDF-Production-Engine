name: Resume Studio T45 frozen template and export audit
on:
  push:
    branches: ['resume-studio/v6-template-export-final-turn45']
permissions:
  contents: read
concurrency:
  group: resume-studio-v6-template-export-final-turn45
  cancel-in-progress: true
jobs:
  pagination-matrix:
    runs-on: windows-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - locale: zh-CN
            modes: natural
            suite: natural
          - locale: en-US
            modes: natural
            suite: natural
    defaults:
      run:
        working-directory: resume-studio-validation/app
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: |
          npm install --global pnpm@10.30.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build actual Electron application
        run: pnpm desktop:build
      - name: Render actual template matrix
        env:
          RESUME_MATRIX_LOCALE: ${{ matrix.locale }}
          RESUME_MATRIX_MODES: ${{ matrix.modes }}
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $env:RESUME_MATRIX_SOURCE_SHA = '4cf2baeb1cd39ec959e1f5189d91e886af4ed193'
          $env:RESUME_MATRIX_OUT = Join-Path $env:GITHUB_WORKSPACE 'natural-matrix'
          & .\node_modules\.bin\electron.cmd .\scripts\qa-template-matrix.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned PDF audit dependency
        timeout-minutes: 2
        run: |
          python -m pip install --disable-pip-version-check PyMuPDF==1.26.7
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Audit actual PDF output
        timeout-minutes: 2
        run: |
          $source = '4cf2baeb1cd39ec959e1f5189d91e886af4ed193'
          python scripts/qa-audit-template-matrix.py --root (Join-Path $env:GITHUB_WORKSPACE 'natural-matrix') --locale '${{ matrix.locale }}' --modes '${{ matrix.modes }}' --source-sha $source --runner-sha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload PDF matrix and audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pagination-${{ matrix.suite }}-${{ matrix.locale }}
          path: natural-matrix/
          if-no-files-found: error
          retention-days: 3


  cross-format:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: resume-studio-validation/app
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned dependencies
        timeout-minutes: 4
        run: |
          npm install --global pnpm@10.30.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Candidate typecheck
        timeout-minutes: 2
        run: pnpm typecheck
      - name: Full Windows regression
        timeout-minutes: 3
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'resume-studio-export-integrity-final'
          New-Item -ItemType Directory -Force $out | Out-Null
          pnpm exec vitest run --reporter=json --outputFile="$out/candidate-vitest.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build actual Electron application
        timeout-minutes: 3
        run: pnpm desktop:build
      - name: Full actual Electron regression
        timeout-minutes: 4
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $env:RESUME_STUDIO_DATA_DIR = Join-Path $env:RUNNER_TEMP ('resume-studio-synthetic-' + [guid]::NewGuid().ToString())
          $env:RESUME_STUDIO_EVIDENCE_OUT = Join-Path $env:GITHUB_WORKSPACE 'resume-studio-export-integrity-final/application'
          & .\node_modules\.bin\electron.cmd .\validation-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual normal receipt and archived source scenario
        timeout-minutes: 2
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $env:RESUME_STUDIO_DATA_DIR = Join-Path $env:RUNNER_TEMP ('synthetic-export-normal-' + [guid]::NewGuid().ToString())
          $env:RESUME_STUDIO_EVIDENCE_OUT = Join-Path $env:GITHUB_WORKSPACE 'resume-studio-export-integrity-final\normal'
          & .\node_modules\.bin\electron.cmd .\validation-export-normal.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned PDF audit dependency
        timeout-minutes: 2
        run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.7
      - name: Verify ordinary and concurrent cover-letter PDFs
        timeout-minutes: 2
        run: python validation-export-normal-audit.py --root (Join-Path $env:GITHUB_WORKSPACE 'resume-studio-export-integrity-final\normal') --runner-sha $env:GITHUB_SHA
      - name: Upload actual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: turn45-cross-format
          path: resume-studio-export-integrity-final/
          if-no-files-found: error
          retention-days: 3

  portrait:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: resume-studio-validation/app
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned dependencies
        timeout-minutes: 4
        run: |
          npm install --global pnpm@10.30.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build actual desktop application
        timeout-minutes: 3
        run: pnpm desktop:build
      - name: Actual managed portrait positive and negative exports and warning UI
        timeout-minutes: 3
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $env:RESUME_STUDIO_DATA_DIR = Join-Path $env:RUNNER_TEMP ('synthetic-contained-export-' + [guid]::NewGuid().ToString())
          $env:RESUME_STUDIO_EVIDENCE_OUT = Join-Path $env:GITHUB_WORKSPACE 'resume-studio-portrait-receipts'
          & .\node_modules\.bin\electron.cmd .\validation-managed-export.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned PDF audit dependency
        timeout-minutes: 2
        run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.7
      - name: Audit actual portrait bytes and pixels
        timeout-minutes: 2
        run: python validation-managed-export-audit.py --root (Join-Path $env:GITHUB_WORKSPACE 'resume-studio-portrait-receipts') --runner-sha $env:GITHUB_SHA
      - name: Upload portrait evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resume-studio-portrait-receipts
          path: resume-studio-portrait-receipts/
          if-no-files-found: error
          retention-days: 3
