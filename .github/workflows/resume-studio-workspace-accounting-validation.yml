name: Resume Studio V6 platform-explicit containment test accounting
on:
  push:
    branches: ['resume-studio/v6-workspace-accounting-validation']
permissions:
  contents: read
concurrency:
  group: resume-studio-v6-workspace-accounting-validation
  cancel-in-progress: true
jobs:
  accounting:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: resume-studio-validation/app
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned dependencies
        timeout-minutes: 4
        run: |
          npm install --global pnpm@10.30.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Typecheck explicitly skipped tests
        timeout-minutes: 2
        run: pnpm typecheck
      - name: Exact prior source reproduction with platform-aware accounting
        timeout-minutes: 2
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'resume-studio-accounting-evidence'
          New-Item -ItemType Directory -Force $out | Out-Null
          $target = Join-Path (Get-Location) 'src/server/localFsApi.ts'
          $candidate = [IO.File]::ReadAllBytes($target)
          try {
            [IO.File]::WriteAllBytes($target,[IO.File]::ReadAllBytes((Join-Path (Get-Location) 'validation-fixtures/localFsApi.turn28-baseline.txt')))
            pnpm exec vitest run src/server/workspaceContainment.test.ts src/server/applicationContainment.test.ts --reporter=json --outputFile="$out/baseline-vitest.json"
            $baselineCode = $LASTEXITCODE
          } finally {
            [IO.File]::WriteAllBytes($target,$candidate)
          }
          $j = Get-Content "$out/baseline-vitest.json" -Raw | ConvertFrom-Json
          if ($baselineCode -eq 0 -or $j.numFailedTests -ne 15 -or $j.numPassedTests -ne 2 -or $j.numPendingTests -ne 1 -or $j.numTotalTests -ne 18) { throw 'Unexpected baseline counts' }
          $LASTEXITCODE = 0
      - name: Applicable candidate tests on Linux
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'resume-studio-accounting-evidence'
          pnpm exec vitest run src/server/workspaceContainment.test.ts src/server/applicationContainment.test.ts --reporter=json --outputFile="$out/candidate-vitest.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $j = Get-Content "$out/candidate-vitest.json" -Raw | ConvertFrom-Json
          if ($j.numPassedTests -ne 17 -or $j.numPendingTests -ne 1 -or $j.numFailedTests -ne 0) { throw 'Incorrect candidate counts' }
      - name: Full Windows synthetic regression with one explicit platform skip
        if: runner.os == 'Windows'
        timeout-minutes: 3
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'resume-studio-accounting-evidence'
          pnpm exec vitest run --reporter=json --outputFile="$out/candidate-vitest.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $j = Get-Content "$out/candidate-vitest.json" -Raw | ConvertFrom-Json
          if ($j.numPassedTests -ne 382 -or $j.numPendingTests -ne 1 -or $j.numFailedTests -ne 0) { throw 'Incorrect candidate counts' }
      - name: Upload explicit test accounting
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resume-studio-accounting-${{ matrix.os }}
          path: resume-studio-accounting-evidence/
          if-no-files-found: error
          retention-days: 3
