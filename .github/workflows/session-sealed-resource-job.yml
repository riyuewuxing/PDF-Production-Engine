name: Session Sealed Resource Job

on:
  push:
    branches:
      - 'session-job/**'

permissions:
  contents: read
  statuses: write

jobs:
  session-resource-job:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Require repository owner session opener
        run: |
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER" || { echo 'owner only'; exit 2; }
          case "$GITHUB_HEAD_COMMIT_MESSAGE" in
            'session: open '*) ;;
            *) echo 'not a session opener commit'; exit 2 ;;
          esac
        env:
          GITHUB_HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

      - name: Checkout engine request branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Validate session request and pinned engine parent
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import hashlib, json, re, subprocess
          from pathlib import Path

          p = Path('.engine-job/session-request.json')
          if not p.is_file():
              raise SystemExit('missing .engine-job/session-request.json')
          raw = p.read_bytes()
          data = json.loads(raw)
          if data.get('version') != 1 or data.get('schema') != 'pdf-engine-session-request-v1':
              raise SystemExit('session request schema/version invalid')
          request_id = data.get('request_id')
          if not isinstance(request_id, str) or not re.fullmatch(r'[A-Za-z0-9._-]{8,80}', request_id):
              raise SystemExit('request_id invalid')
          return_key = data.get('return_public_key')
          if not isinstance(return_key, str) or not re.fullmatch(r'[A-Za-z0-9_-]{40,60}', return_key):
              raise SystemExit('return_public_key invalid')
          expected_engine = data.get('engine_commit')
          if not isinstance(expected_engine, str) or not re.fullmatch(r'[0-9a-f]{40}', expected_engine):
              raise SystemExit('engine_commit invalid')
          actual_parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          if actual_parent != expected_engine:
              raise SystemExit(f'engine parent drift: {actual_parent} != {expected_engine}')
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', actual_parent, 'HEAD'], text=True
          ).splitlines()
          if changed != ['.engine-job/session-request.json']:
              raise SystemExit(f'opening commit may change only session request, got: {changed}')
          print(f'REQUEST_ID={request_id}')
          print(f'RETURN_PUBLIC_KEY={return_key}')
          print(f'ENGINE_CODE_COMMIT={actual_parent}')
          print(f'REQUEST_SHA256={hashlib.sha256(raw).hexdigest()}')
          PY

      - name: Generate one-time engine receive key
        run: |
          pdf-session keygen             --private-out /tmp/session-private.key             --public-out /tmp/session-public.txt
          echo "SESSION_PUBLIC_KEY=$(cat /tmp/session-public.txt)"
          echo "::notice title=Session receive key::SESSION_PUBLIC_KEY=$(cat /tmp/session-public.txt)"
          python - <<'PY'
          import json, os, urllib.request
          key = open('/tmp/session-public.txt', encoding='ascii').read().strip()
          desc = f"key={key} request={os.environ['REQUEST_ID']}"
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
              data=json.dumps({
                  'state':'pending',
                  'context':'pdf-engine/session-key',
                  'description':desc[:140],
              }).encode(),
              headers={
                  'Authorization':f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28',
                  'Content-Type':'application/json',
              },
              method='POST',
          )
          with urllib.request.urlopen(req) as r:
              assert r.status == 201
          PY
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install generic document and figure runtime
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends             texlive-xetex             texlive-lang-chinese             texlive-latex-extra             texlive-pictures             texlive-science             fonts-noto-cjk             fonts-arphic-ukai             fonts-arphic-uming             fonts-wqy-zenhei             poppler-utils             fontconfig

      - name: Wait for encrypted payload on same branch
        run: |
          remote_ref="refs/remotes/origin/$GITHUB_REF_NAME"
          found=0
          for _ in $(seq 1 180); do
            git fetch --quiet origin "+refs/heads/$GITHUB_REF_NAME:$remote_ref"
            git merge-base --is-ancestor "$GITHUB_SHA" "$remote_ref" || {
              echo 'session branch no longer descends from opening commit'
              exit 2
            }
            latest_request_sha="$(git show "$remote_ref:.engine-job/session-request.json" | sha256sum | awk '{print $1}')"
            test "$latest_request_sha" = "$REQUEST_SHA256" || {
              echo 'session request changed after opening'
              exit 2
            }
            if git cat-file -e "$remote_ref:.engine-job/input.sealed" 2>/dev/null &&
               git cat-file -e "$remote_ref:.engine-job/input.sha256" 2>/dev/null; then
              git show "$remote_ref:.engine-job/input.sealed" > /tmp/input.sealed
              git show "$remote_ref:.engine-job/input.sha256" | tr -d '\r\n ' > /tmp/input.sha256
              found=1
              break
            fi
            sleep 5
          done
          test "$found" = 1 || { echo 'timed out waiting for encrypted session payload'; exit 2; }
          echo "$(cat /tmp/input.sha256)  /tmp/input.sealed" | sha256sum -c -

      - name: Decrypt package in ephemeral runner storage
        run: |
          pdf-session unseal             --private-key "$(cat /tmp/session-private.key)"             --request-id "$REQUEST_ID"             --input /tmp/input.sealed             --output /tmp/pdf-engine-job.zip
          rm -rf /tmp/pdf-engine-job /tmp/pdf-engine-output
          mkdir -p /tmp/pdf-engine-job /tmp/pdf-engine-output
          python - <<'PY'
          from pathlib import Path
          import zipfile
          src = Path('/tmp/pdf-engine-job.zip')
          root = Path('/tmp/pdf-engine-job').resolve()
          with zipfile.ZipFile(src) as z:
              for member in z.infolist():
                  target = (root / member.filename).resolve()
                  if root != target and root not in target.parents:
                      raise SystemExit(f'zip path escape rejected: {member.filename}')
              z.extractall(root)
          PY

      - name: Validate generic engine instruction
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from pathlib import Path
          import re, yaml
          p = Path('/tmp/pdf-engine-job/engine-run.yaml')
          data = yaml.safe_load(p.read_text(encoding='utf-8')) or {}
          if data.get('version') != 1:
              raise SystemExit('engine-run version must be 1')
          job = data.get('job_file')
          block = data.get('block_id')
          dpi = int(data.get('dpi', 144))
          if not isinstance(job, str) or not re.fullmatch(r'[A-Za-z0-9._-]+', job):
              raise SystemExit('job_file must be a simple filename')
          if not isinstance(block, str) or not re.fullmatch(r'[A-Za-z0-9._-]+', block):
              raise SystemExit('block_id invalid')
          if not 72 <= dpi <= 300:
              raise SystemExit('dpi out of range')
          print(f'ENGINE_JOB_FILE={job}')
          print(f'ENGINE_BLOCK_ID={block}')
          print(f'ENGINE_DPI={dpi}')
          PY

          export ENGINE_JOB_FILE="$(python -c "import yaml; print((yaml.safe_load(open('/tmp/pdf-engine-job/engine-run.yaml', encoding='utf-8')) or {})['job_file'])")"
          export ENGINE_BLOCK_ID="$(python -c "import yaml; print((yaml.safe_load(open('/tmp/pdf-engine-job/engine-run.yaml', encoding='utf-8')) or {})['block_id'])")"
          export ENGINE_DPI="$(python -c "import yaml; print(int((yaml.safe_load(open('/tmp/pdf-engine-job/engine-run.yaml', encoding='utf-8')) or {}).get('dpi', 144)))")"

          python - <<'PY'
          from pathlib import Path
          import os, yaml
          p = Path('/tmp/pdf-engine-job') / os.environ['ENGINE_JOB_FILE']
          data = yaml.safe_load(p.read_text(encoding='utf-8')) or {}
          if data.get('privacy') != 'session':
              raise SystemExit('session workflow requires privacy: session')
          blocks = {
              b.get('block_id'): b for b in data.get('blocks', [])
              if isinstance(b, dict)
          }
          block = blocks.get(os.environ['ENGINE_BLOCK_ID'])
          if not block:
              raise SystemExit('requested block missing')
          allowed = {'figure', 'chart', 'source-page', 'asset', 'composition', 'final-pdf'}
          if block.get('kind') not in allowed:
              raise SystemExit(f"block kind is not Engine-owned mechanical work: {block.get('kind')}")
          PY
          pdf-resource-job "/tmp/pdf-engine-job/$ENGINE_JOB_FILE"

      - name: Execute exactly one Engine-owned resource block
        run: |
          pdf-resource-run             --root /tmp/pdf-engine-job             --job "$ENGINE_JOB_FILE"             --block "$ENGINE_BLOCK_ID"             --out /tmp/pdf-engine-output             --dpi "$ENGINE_DPI"

      - name: Add execution provenance and encrypt result
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('/tmp/pdf-engine-output/session-execution.json')
          p.write_text(json.dumps({
              'version': 1,
              'schema': 'pdf-engine-session-execution-v1',
              'request_id': os.environ['REQUEST_ID'],
              'engine_repository': os.environ['GITHUB_REPOSITORY'],
              'engine_code_commit': os.environ['ENGINE_CODE_COMMIT'],
              'opening_commit': os.environ['GITHUB_SHA'],
              'execution_surface': 'github-hosted-public-engine-ephemeral-session',
              'plaintext_persisted': False,
          }, indent=2) + '\n', encoding='utf-8')
          PY
          python - <<'PY'
          import shutil
          shutil.make_archive('/tmp/pdf-engine-result', 'zip', '/tmp/pdf-engine-output')
          PY
          pdf-session seal             --public-key "$RETURN_PUBLIC_KEY"             --request-id "$REQUEST_ID"             --input /tmp/pdf-engine-result.zip             --output /tmp/pdf-engine-result.sealed
          sha256sum /tmp/pdf-engine-result.sealed > /tmp/pdf-engine-result.sealed.sha256

      - name: Upload encrypted result only
        uses: actions/upload-artifact@v4
        with:
          name: session-sealed-result
          path: |
            /tmp/pdf-engine-result.sealed
            /tmp/pdf-engine-result.sealed.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Publish success status
        if: success()
        run: |
          python - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
              data=json.dumps({
                  'state':'success',
                  'context':'pdf-engine/session-job',
                  'description':f"encrypted result ready request={os.environ['REQUEST_ID']}"[:140],
              }).encode(),
              headers={
                  'Authorization':f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28',
                  'Content-Type':'application/json',
              },
              method='POST',
          )
          with urllib.request.urlopen(req) as r:
              assert r.status == 201
          PY
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Cleanup plaintext runner storage
        if: always()
        run: |
          rm -rf             /tmp/session-private.key             /tmp/session-public.txt             /tmp/input.sealed             /tmp/input.sha256             /tmp/pdf-engine-job             /tmp/pdf-engine-job.zip             /tmp/pdf-engine-output             /tmp/pdf-engine-result.zip
          echo 'Session plaintext and one-time private key removed from runner temp storage.'
