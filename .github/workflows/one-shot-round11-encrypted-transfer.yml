name: One-shot encrypted Round 11 transfer

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  transfer:
    if: contains(github.event.head_commit.message, '[round11-encrypted-transfer]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload encrypted transfer package
        uses: actions/upload-artifact@v4
        with:
          name: round11-encrypted-chat-transfer
          path: .tmp/round11-chat-transfer-20260918-1506.enc.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
