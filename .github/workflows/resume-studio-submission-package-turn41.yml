name: Resume Studio Turn41 scoped submission package
on:
  push:
    branches: ['resume-studio/v6-submission-package-turn41']
permissions:
  contents: read
jobs:
  package-validation:
    runs-on: windows-latest
    timeout-minutes: 16
    defaults:
      run:
        working-directory: resume-studio-validation/app
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked dependencies
        timeout-minutes: 4
        run: |
          npm install --global pnpm@10.30.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Typecheck and build
        timeout-minutes: 3
        run: |
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm desktop:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Full synthetic regression
        timeout-minutes: 3
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'submission-package-evidence'
          New-Item -ItemType Directory -Force $out | Out-Null
          pnpm exec vitest run --reporter=json --outputFile="$out/vitest.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual Windows export, ledger and ZIP
        timeout-minutes: 5
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $env:RESUME_STUDIO_DATA_DIR = Join-Path $env:RUNNER_TEMP ('synthetic-pdf-receipt-' + [guid]::NewGuid().ToString())
          $env:RESUME_STUDIO_EVIDENCE_OUT = Join-Path $env:GITHUB_WORKSPACE 'submission-package-evidence/native'
          & .\node_modules\.bin\electron.cmd .\validation-submission-package.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Independent ZIP byte and CRC verification
        timeout-minutes: 1
        run: |
          python -c "import pathlib,zipfile,hashlib,json,os; p=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'submission-package-evidence'/'native'; z=zipfile.ZipFile(p/'actual-package.zip'); assert z.namelist()==['resume.pdf','attachment-01.pdf']; assert z.testzip() is None; assert z.read('resume.pdf')==(p/'expected-resume.pdf').read_bytes(); assert z.read('attachment-01.pdf')==(p/'expected-attachment.pdf').read_bytes(); print('Independent ZIP CRC, exact entry list and byte equality verified'); (p/'independent-verification.json').write_text(json.dumps({'entries':z.namelist(),'crcPassed':True,'byteEquality':True,'sha256':hashlib.sha256((p/'actual-package.zip').read_bytes()).hexdigest()}))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: submission-package-evidence
          path: submission-package-evidence/
          if-no-files-found: warn
          retention-days: 3
