name: Session Result Cleanup

on:
  push:
    branches:
      - main
    paths:
      - '.engine-session/**/retrieved.json'

permissions:
  contents: read
  actions: write

jobs:
  purge-retrieved-result:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate retrieval marker and delete result artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          case "$HEAD_MESSAGE" in 'session: retrieved '*) ;; *) exit 2 ;; esac
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import urllib.request
          from pathlib import Path

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', 'HEAD^', 'HEAD'], text=True
          ).splitlines()
          paths = [
              p for p in changed
              if re.fullmatch(r'\.engine-session/[A-Za-z0-9._-]{8,80}/retrieved\.json', p)
          ]
          if len(paths) != 1:
              raise SystemExit(f'exactly one retrieved.json required: {paths}')

          path = Path(paths[0])
          data = json.loads(path.read_text(encoding='utf-8'))
          if data.get('version') != 1 or data.get('schema') != 'pdf-engine-session-retrieved-v1':
              raise SystemExit('bad retrieval marker schema')
          request_id = data.get('request_id')
          if request_id != path.parent.name:
              raise SystemExit('request id/path mismatch')
          run_id = data.get('workflow_run_id')
          if not isinstance(run_id, int) or run_id <= 0:
              raise SystemExit('workflow_run_id must be a positive integer')

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'pdf-engine-session-result-cleanup/1.0',
          }

          def api(url: str, method: str = 'GET'):
              req = urllib.request.Request(url, headers=headers, method=method)
              with urllib.request.urlopen(req) as response:
                  return response.read()

          raw = api(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100')
          artifacts = json.loads(raw).get('artifacts') or []
          targets = [
              a for a in artifacts
              if a.get('name') == 'session-sealed-result' and not a.get('expired')
          ]
          for artifact in targets:
              artifact_id = artifact.get('id')
              if not isinstance(artifact_id, int):
                  raise SystemExit('artifact id missing')
              api(
                  f'https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}',
                  method='DELETE',
              )
              print(f'DELETED_ARTIFACT id={artifact_id} request={request_id} run={run_id}')

          if not targets:
              print(f'NO_ACTIVE_RESULT_ARTIFACT request={request_id} run={run_id}')
          PY
