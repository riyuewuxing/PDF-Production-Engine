name: Session Result Cleanup

on:
  push:
    branches:
      - main
    paths:
      - '.engine-session/**/retrieved.json'

permissions:
  contents: write

jobs:
  purge-retrieved-result:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate retrieval marker and delete temporary result branch
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          case "$HEAD_MESSAGE" in 'session: retrieved '*) ;; *) exit 2 ;; esac
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          import re
          import subprocess
          from pathlib import Path

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', 'HEAD^', 'HEAD'], text=True
          ).splitlines()
          paths = [
              p for p in changed
              if re.fullmatch(r'\.engine-session/[A-Za-z0-9._-]{8,80}/retrieved\.json', p)
          ]
          if len(paths) != 1:
              raise SystemExit(f'exactly one retrieved.json required: {paths}')

          path = Path(paths[0])
          data = json.loads(path.read_text(encoding='utf-8'))
          if data.get('version') != 1 or data.get('schema') != 'pdf-engine-session-retrieved-v1':
              raise SystemExit('bad retrieval marker schema')
          request_id = data.get('request_id')
          if request_id != path.parent.name:
              raise SystemExit('request id/path mismatch')
          expected_branch = f'session-result/{request_id}'
          result_branch = data.get('result_branch', expected_branch)
          if result_branch != expected_branch:
              raise SystemExit('result branch mismatch')
          result_commit = data.get('result_commit')
          if result_commit is not None and (
              not isinstance(result_commit, str) or not re.fullmatch(r'[0-9a-f]{40}', result_commit)
          ):
              raise SystemExit('bad result_commit')
          print(f'REQUEST_ID={request_id}')
          print(f'RESULT_BRANCH={result_branch}')
          if result_commit:
              print(f'RESULT_COMMIT={result_commit}')
          PY

          if git ls-remote --exit-code --heads origin "$RESULT_BRANCH" >/dev/null 2>&1; then
            if [ -n "${RESULT_COMMIT:-}" ]; then
              remote_commit="$(git ls-remote --heads origin "$RESULT_BRANCH" | awk '{print $1}')"
              test "$remote_commit" = "$RESULT_COMMIT" || {
                echo "result branch commit drift: $remote_commit != $RESULT_COMMIT"
                exit 2
              }
            fi
            git push origin --delete "$RESULT_BRANCH"
            echo "DELETED_RESULT_BRANCH branch=$RESULT_BRANCH request=$REQUEST_ID"
          else
            echo "NO_ACTIVE_RESULT_BRANCH branch=$RESULT_BRANCH request=$REQUEST_ID"
          fi
