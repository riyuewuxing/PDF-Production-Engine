version: 2
status: CANDIDATE_PENDING_USER_ACCEPTANCE
contract: GENERIC_CONTENT_SLOTS_V1
renderer_api: render(data)
sample:
  identity: NEUTRAL_SYNTHETIC_EXAMPLE
  same_content_for_all_templates: true
  business_content: false
selection_policy:
  after_acceptance: random_uniform_over_accepted_templates
  initial_activation_requires_all_current_ten_accepted: true
  future_templates_append_only_until_reviewed: true
  rejected_or_revise_templates_excluded_from_random_pool: true
templates:
- {id: T01, name: Editorial Serif, file: T01_editorial_serif.typ, family: editorial-note}
- {id: T02, name: Margin Fieldnotes, file: T02_margin_fieldnotes.typ, family: margin-note}
- {id: T03, name: Cornell Study, file: T03_cornell_study.typ, family: cornell-workbook}
- {id: T04, name: Bento Modular, file: T04_bento_modular.typ, family: modular-cards}
- {id: T05, name: Classic Academic, file: T05_classic_academic.typ, family: academic-handout}
- {id: T06, name: Studio Workbook, file: T06_studio_workbook.typ, family: worksheet}
- {id: T07, name: Atlas Navigation, file: T07_atlas_navigation.typ, family: atlas-index}
- {id: T08, name: Modern Manual, file: T08_modern_manual.typ, family: manual-docs}
- {id: T09, name: Dense Reference, file: T09_dense_reference.typ, family: reference-sheet}
- {id: T10, name: Premium Contrast, file: T10_premium_contrast.typ, family: premium-notes}
contains_business_content: false
runtime_dependency: Typst >=0.15.0; CJK font provided by runtime/staging environment
visual_gate:
  self_review_required: true
  user_acceptance_required: true
  random_pool_enabled: false
  minimum_score: 88
  first_glance_floor: 12
