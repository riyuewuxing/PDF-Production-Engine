version: 2
status: ROUND2_STRESS_ACCEPTED_SESSION_EVIDENCE
canonical_backend: xelatex
engine_policy:
  authored_pdf_backend: xelatex
  typst_template_pool: REJECTED_LEGACY_ONLY
  reportlab_authored_layout: NONCANONICAL_LEGACY_ONLY
  shell_escape: false
  cjk: CTeX_or_xeCJK
  latex_build_capability: xelatex-pdf-build-v2
  strict_final_log_gate: true
candidate_count: 5
random_pool_enabled: false
production_acceptance: PENDING_ROUND3

typography_baseline:
  body_size_pt_range: [10.5, 11.5]
  chinese_leading_guidance: 'For these A4 bases, approximately 1.45-1.55 line spacing; visual review remains authoritative.'
  paragraph_indent: 2em
  rule: >-
    Chinese prose must remain comfortable across multi-page continuous reading. Compile success alone cannot accept
    line spacing, line length, paragraph rhythm, heading whitespace, or page balance.

round2_benchmark:
  file: round2-stress-content.tex
  external_page_fixture_source: source-page-fixture.tex
  external_page_fixture_sha256: 23220bfe47ab463a996010587e4e80f87e9b0edbeba12e7b368e8aac668c5a34
  neutral_content: true
  same_content_for_all_candidates: true
  required_features:
    - long_chinese_prose
    - dense_and_intentionally_sparse_pages
    - multi_page_sections
    - long_wrapped_headings
    - breakable_longtable_with_repeated_header
    - inline_display_and_aligned_equations
    - tikz_figure
    - pgfplots_figure
    - externally_compiled_pdf_page_placement
    - captions
    - footnotes
    - quotations
    - lists
    - long_url_wrapping
    - toc_headers_footers_and_transitions
    - orphan_heading_pressure
    - font_coverage_pressure
    - grayscale_structure_distinctness
  combined_review:
    page_count: 53
    dpi: 200
    sha256: a09cc17e39b8c3ddbc5759d6e481fdce8df179c0ae2c5ad697931adff507808a
    preflight: PASS
    every_page_rendered: true
    chatgpt_visual_review: PASS
    defects:
      clipping: 0
      overlap: 0
      broken_cjk_glyphs: 0
      accidental_blank_or_near_blank_pages: 0
      table_overflow: 0
      figure_crop: 0

strict_log_gate:
  final_pass_zero_required:
    - missing_characters
    - overfull_hbox
    - overfull_vbox
    - undefined_references
    - rerun_needed
  negative_test:
    case: unsupported_emoji_missing_glyph
    result: REJECTED_AS_EXPECTED

