round2_rejections_and_fixes:
  - failure: round1_chinese_leading_too_tight
    disposition: FIXED_AND_REBUILT
  - failure: incidental_near_empty_page_after_float_list_transition_in_early_stress_build
    disposition: FIXED_BENCHMARK_FLOW_AND_REBUILT

three_round_acceptance:
  round1:
    status: COMPLETE
    goal: migrate architecture to XeLaTeX and establish five compiling candidates
  round2:
    status: COMPLETE_SESSION_EVIDENCE
    goal: stress-test, compare and refine the five families
  round3:
    status: PENDING
    goal: real consumer PDF build, full-page visual acceptance, hash-bound freeze
final_acceptance_requires:
  - round3_real_consumer_pdf_pass
  - full_page_render_review
  - no_clipping_overlap_broken_glyphs
  - accepted_sha256_receipts
  - production_pool_activation_after_round3_only
