  evidence_required: [SUBMISSION_FREEZE bytes, INDEPENDENT_CONTENT_REVIEW bytes, source commit, transition digest]
  failure_code: CONTENT_HUMAN_ACCEPTANCE_RECEIPT_INVALID
  gate_effect: blocks HUMAN_ACCEPTED and all protected downstream
  historical_probe: post-freeze-state-loop

- requirement_id: REQ-WPK-001
  severity: HARD
  authority_source: ADR-012#Work-packets
  subject: phase_specific_work_packet
  enforcement_class: MACHINE_DETERMINISTIC
  enforcer: work packet validator
  evidence_required: [main SHA, current state, durable state_trace, schema, REQ IDs, source refs, allowed/forbidden writes, expected evidence, next gate]
  failure_code: CONTENT_ARCH_WORK_PACKET_INVALID
  gate_effect: blocks state-specific generation action
  historical_probe: long-context-rule-loss-root-cause

source_review_receipt:
