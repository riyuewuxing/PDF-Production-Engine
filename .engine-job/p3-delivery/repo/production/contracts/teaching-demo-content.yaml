  semantic_requirement: REQ-REL-001
  each_release_verification_requires: [knowledge_id, event_id, visible_span, verdict, reason, confidence, evidence_refs]
  required_evidence_refs_per_release: [event:<event_id>, exact-text:<visible_span>]
  PASS_required: true
  FAIL_or_UNKNOWN_blocks: true
  output_runtime_view: verified_first_release
  hard_causality_consumers: [board strict formation causality, answer-resource first-full-exposure causality]
  author_bare_metadata_may_not_populate_verified_first_release: true

content_state_machine:
  states:
  - SOURCE_LOCKED
  - EVIDENCE_READY
  - IR_READY
  - SCRIPT_BUILT
  - SCRIPT_FACTS_DERIVED
  - MACHINE_GATED
  - SEMANTIC_JUDGED
  - SUBMISSION_FROZEN
  - HUMAN_ACCEPTED
  allowed_transitions:
  - [SOURCE_LOCKED, EVIDENCE_READY]
  - [EVIDENCE_READY, IR_READY]
  - [IR_READY, SCRIPT_BUILT]
  - [SCRIPT_BUILT, SCRIPT_FACTS_DERIVED]
  - [SCRIPT_FACTS_DERIVED, MACHINE_GATED]
  - [MACHINE_GATED, SEMANTIC_JUDGED]
  - [SEMANTIC_JUDGED, SUBMISSION_FROZEN]
  - [SUBMISSION_FROZEN, HUMAN_ACCEPTED]
  forbidden_shortcuts:
  - [SCRIPT_BUILT, SUBMISSION_FROZEN]
  - [AUTHOR_SELF_CHECK_PASS, MACHINE_GATED]
  - [MACHINE_GATED, HUMAN_ACCEPTED]
  facts_required_before_machine_gate: true
  source_review_required_before_evidence_ready: true
  all_applicable_deterministic_hard_requirements_through_MACHINE_GATED_must_pass: true
  later_stage_machine_requirements_must_not_be_predeclared_as_MACHINE_GATE_PASS: true
  all_blocking_semantic_verdicts_pass_before_submission_frozen: true
  verified_first_release_required_before_board_resource_semantic_stage_causality_pass: true
  work_packet_terminal_state: SUBMISSION_FROZEN
  HUMAN_ACCEPTED_transition_location: HUMAN_ACCEPTANCE_RECEIPT.yaml
  work_packet_must_not_be_mutated_after_freeze_to_record_HUMAN_ACCEPTED: true
  durable_transition_trace:
    location: WORK_PACKET.yaml#state_trace
    complete_prefix_from_SOURCE_LOCKED_required: true
    exact_adjacent_sequence_required: true
    terminal_transition_in_work_packet: [SEMANTIC_JUDGED, SUBMISSION_FROZEN]
    each_transition_requires: [from_state, to_state, evidence_refs, transition_digest]
    evidence_refs_must_resolve_to_expected_artifacts: true
    transition_digest_is_sha256_of_record_without_transition_digest: true
    author_claimed_final_state_without_complete_trace_may_unlock: false

phase_specific_work_packet:
  schema_id: teaching-demo-work-packet-v1
  required_fields: [main_sha, current_state, task_schema, requirement_ids, source_refs, reference_mechanisms, allowed_writes, forbidden_writes, expected_evidence, next_gate, state_trace]
  requirement_ids_should_be_minimal_relevant_subset: true
  state_trace_is_durable_execution_evidence_not_second_state_machine: true
  frozen_packet_current_state_required: SUBMISSION_FROZEN
  frozen_packet_next_gate_required: HUMAN_ACCEPTED

state_trace_evidence_refs:
  allowed_schemes: [artifact, source-lock]
  SOURCE_LOCKED_to_EVIDENCE_READY: [source-lock:<binding_digest>, artifact:SOURCE_REVIEW.yaml]
  EVIDENCE_READY_to_IR_READY: [artifact:LESSON_EVIDENCE_IR.yaml]
  IR_READY_to_SCRIPT_BUILT: [artifact:SCRIPT_EVENTS.yaml]
  SCRIPT_BUILT_to_SCRIPT_FACTS_DERIVED: [artifact:SCRIPT_FACTS.yaml]
  SCRIPT_FACTS_DERIVED_to_MACHINE_GATED: [artifact:MACHINE_GATE.yaml]
  MACHINE_GATED_to_SEMANTIC_JUDGED: [artifact:SCIENCE_EVIDENCE_JUDGE.yaml, artifact:ENACTMENT_STUDENT_JUDGE.yaml]
  SEMANTIC_JUDGED_to_SUBMISSION_FROZEN: [artifact:SUBMISSION_FREEZE.yaml]

semantic_judges:
  verdict_schema:
    required_fields: [requirement_id, verdict, claim, evidence_refs, reason, confidence]
    verdicts: [PASS, FAIL, UNKNOWN]
    exact_evidence_refs_required: true
    missing_evidence_ref_invalidates_verdict: true
    blocking_unknown_is_pass: false
    author_decision_pass_is_trusted_evidence: false
  producer_provenance:
    role_and_separation_fields_are_declarations_not_identity_proof: true
    phase_a_readiness_may_validate_payload_integrity_without_claiming_producer_identity: true
    accepted_mode_requires_phase_b_controller_execution_receipt: true
    repository_authored_role_or_runner_strings_may_not_unlock_accepted: true
    controller_receipt_must_bind_exact_input_runtime_and_output_before_accepted_mode_can_exist: true
  judge_binding_closure_must_include:
  - canonical PROCESS/contract/checker/internal-core/architecture-helper/architecture-impl/enforcement-helper bytes
  - manifest and normalized source-lock digest
  - repository source PDF exact bytes
  - SOURCE_REVIEW receipt
  - reference usage contract and selected CASE receipts
  - structural candidate comparison with exact candidate CASE receipt SHA-256 values
  - all deterministic semantic sidecars
  - Lesson Evidence IR / SCRIPT_EVENTS / SCRIPT_FACTS
  - all five final user content roles
  - BOARD_PLAN
  - MACHINE_GATE receipt
  work_packet_is_not_bound_until_freeze_because_single_packet_state_trace_advances_after_machine_gate: true
  science_evidence_judge:
    owns_requirement_prefixes: [REQ-SCI, REQ-REL-001, REQ-STU-001, REQ-RES-003]
    checks: [evidence_entered_classroom, observation_vs_inference, claim_strength, conditions_and_boundaries, response_reachability, release_claim_semantic_entailment]
    release_verifications_required: true
    release_verification_source: SCRIPT_FACTS.release_claims
    release_verification_evidence_must_bind_same_event_and_exact_visible_span: true
  enactment_student_judge:
    owns_requirement_prefixes: [REQ-STU-002, REQ-STU-003, REQ-INT-002, REQ-TIM-005]
    checks: [answer_leakage, scaffold_honesty, cognitive_interaction, enactment_semantics, residual_formula_oralization, timing_text_correspondence]

