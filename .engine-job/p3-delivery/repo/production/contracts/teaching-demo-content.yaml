  reviewer_role_required: INDEPENDENT_SOURCE_REVIEWER
  implementation_and_review_separate_required: true
  machine_derives_source_binding_from_manifest: true
  machine_checks_repository_pdf_size_git_blob_sha1_and_sha256: true
  machine_checks_receipt_integrity_not_human_visual_truth: true
  required_fields:
  - schema_id
  - case_id
  - reviewer_role
  - implementation_and_review_separate
  - source_binding
  - reviewed_printed_pages
  - reviewed_pdf_pages
  - visual_open_and_review
  - review_notes
  - receipt_digest
  visual_open_and_review_required: PASS
  reviewed_page_lists_must_exactly_equal_manifest_page_mapping: true
  receipt_digest_is_sha256_of_record_without_receipt_digest: true
  author_self_review_may_unlock_EVIDENCE_READY: false

source_and_evidence_rules:
  explicit_task_requirements_have_priority: true
  exact_source_identity_required: true
  formal_source_mode: repository-pdf
  remote_pdf_may_enter_only_pre_ingest: true
  remote_pdf_must_materialize_to_repository_before_SOURCE_LOCKED: true
  remote_pdf_manifest_locator_alone_can_pass_content_gate: false
  repository_pdf_machine_checks: [repository-relative path, size_bytes, Git blob SHA-1, SHA-256, selected PDF page mapping]
  selected_source_pages_must_be_actually_reviewed: true
  source_review_receipt: SOURCE_REVIEW.yaml
  source_review_must_be_independent_from_content_implementation: true
  evidence_units_required: true
  observation_must_be_separate_from_inference: true
  claim_strength_must_not_exceed_evidence: true
  conditions_domains_and_scales_must_not_be_silently_dropped: true
  fabricated_measurement_or_data_forbidden: true
  reference_learning_location: evidence.yaml#reference_learning
