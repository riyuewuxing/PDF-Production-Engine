    formation_claim_must_not_exceed_actual_visible_evidence_prior_knowledge_and_permitted_scaffold: true
    independent_transfer_must_not_receive_key_answer_before_response: true
    sidecar_only_evidence_does_not_count_as_visible: true

typed_script_event_stream:
  schema_id: teaching-demo-script-event-stream-v1
  event_types:
  - SPEAK
  - FORMULA_ORALIZE
  - ASK
  - INVITE
  - WAIT
  - STUDENT_RESPONSE
  - PARAPHRASE
  - FEEDBACK
  - SCAFFOLD
