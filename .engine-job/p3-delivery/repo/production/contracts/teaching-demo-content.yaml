  binds_selected_reference_receipts: true
  binds_manifest_semantic_artifacts_and_all_five_user_content_roles: true
  freeze_file_does_not_self_bind: true
  post_freeze_human_acceptance_receipt_not_bound_here: true
  any_bound_byte_change_invalidates_readiness: true

independent_review_artifact:
  path: INDEPENDENT_CONTENT_REVIEW.yaml
  created_only_after_content_freeze: true
  reviewer_role_required: INDEPENDENT_HUMAN
  decision_required: PASS
  exact_byte_bindings_required: true
  binds_submission_freeze: true

human_acceptance_receipt:
  path: HUMAN_ACCEPTANCE_RECEIPT.yaml
  schema_id: teaching-demo-human-acceptance-v1
  created_only_after_independent_review_PASS: true
  transition: [SUBMISSION_FROZEN, HUMAN_ACCEPTED]
  must_not_mutate_frozen_WORK_PACKET: true
  required_fields: [schema_id, case_id, from_state, to_state, source_commit, bindings, transition_digest]
  binds_exact: [SUBMISSION_FREEZE.yaml, INDEPENDENT_CONTENT_REVIEW.yaml]
  transition_digest_is_sha256_of_record_without_transition_digest: true
  required_for_accepted_mode_and_downstream_unlock: true

score:
  total_points: 100
  submission_threshold: 92
  excellent_target: 95
  hard_fail_overrides_numeric_score: true
  dimensions:
    evidence_boundary_and_science: {points: 20, minimum: 17}
    point_and_cognitive_chain: {points: 16, minimum: 14}
    student_state_and_classroom_cycles: {points: 18, minimum: 16}
    resource_and_inquiry_enactment: {points: 14, minimum: 12}
    board_lineage_and_time_causality: {points: 14, minimum: 12}
    spoken_executability_and_timing: {points: 10, minimum: 9}
    candidate_product_usability: {points: 8, minimum: 7}

hard_fail:
- fabricated_or_unreviewed_source_evidence
- source_identity_or_source_review_binding_stale
