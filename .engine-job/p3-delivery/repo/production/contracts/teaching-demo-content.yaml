- observation_inference_conflation
- condition_or_domain_dropped
- conclusion_stronger_than_evidence
- expected_response_requires_unrevealed_information
- critical_student_question_missing_invite_listen_paraphrase_feedback
- fake_duplicate_or_stale_reference_candidate_receipt
- bare_or_unverified_release_used_as_hard_formation_fact
