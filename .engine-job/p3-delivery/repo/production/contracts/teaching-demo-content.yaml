version: 9
id: teaching-demo-content
scope: teacher_teaching_demo_content_formation
status: ACTIVE_CANONICAL
architecture_decision: architecture/adr/ADR-012-evidence-carrying-teaching-script-compiler.md
architecture_hardening_addendum: architecture/adr/ADR-013-teaching-demo-authority-provenance-and-phase-b-lock.md
architecture_capability_isolation_addendum: architecture/adr/ADR-014-teaching-demo-capability-removal-and-first-full-exposure.md

canonical_checker: tools/check_teaching_demo_content.py
canonical_checker_internal_core: tools/_teaching_demo_content_core.inc
canonical_checker_internal_core_role: PRIMITIVES_ONLY_NO_ACCEPTANCE_ORCHESTRATION_AUTHORITY
canonical_checker_internal_core_direct_execution: ABSENT_NO_CLI
canonical_checker_internal_core_aggregate_import_call: ABSENT_NO_AGGREGATE_SYMBOL
canonical_checker_helper: tools/teaching_demo_content_architecture.py
canonical_checker_helper_impl: tools/_teaching_demo_content_architecture_impl.py
canonical_checker_helper_has_independent_cli: false
canonical_enforcement_helper: tools/teaching_demo_content_enforcement.py
canonical_enforcement_helper_has_independent_cli: false

single_line_policy:
  this_file_is_only_content_contract: true
  canonical_branch: main
  update_in_place_only: true
  new_content_branch_forbidden: true
  parallel_versioned_contracts_forbidden: true
  legacy_content_route_forbidden: true
  backup_content_route_forbidden: true
  alternate_content_quality_checker_forbidden: true
  retired_branch_tree_sha: 61e02317ecaf0db1104911855150b593327d24fe
  retired_branch_tree_role: ONLY_MAIN_REDIRECT_NO_PROJECT_FILES
  forbidden_current_tree_roots:
  - content/job-search/teacher/interview/teaching-demo/high-school/physics/page-to-plan
  - content/job-search/teacher/interview/teaching-demo/references
  - production/teaching-demo-cases/capacitance-v1
  - production/teaching-demo-cases/molecular-kinetic-theory-v1/revisions
  forbidden_current_tree_exact:
  - docs/research/page-to-plan-2026-08.md
  - docs/round-3-page-to-plan.md
  - production/process-development/teaching-demo-quality-v2/IMPLEMENTATION_BLOCKER.md
  - production/process-development/teaching-demo-quality-v2/IMPLEMENTATION_BLOCKER_CORRECTION.md

boundary:
  starts_at: teaching_demo_topic_and_source_material
  ends_at: independent_content_human_acceptance_receipt
  downstream_artifact_pdf_structured_delivery_is_out_of_scope: true

purpose: >-
  Produce scientifically correct, evidence-grounded, classroom-executable Teaching Demo content before PDF composition.
  Visible final content is the factual surface; typed metadata may propose release claims but may not self-authenticate
  knowledge formation. Deterministic requirements are enforced by executable validators, semantic claims require
  evidence-bound judges, and downstream unlock requires independent HUMAN review plus a post-freeze
  HUMAN_ACCEPTANCE_RECEIPT.

architecture_contract:
  direction: EVIDENCE_CARRYING_TEACHING_SCRIPT_COMPILER
  phase: PHASE_A_ARCHITECTURE_CONTRACT
  runtime_authority_unchanged: true
  effective_single_gate_capability_required: true
  acceptance_composition_locality: CANONICAL_CHECKER_VALIDATE_ONLY
  internal_core_aggregate_symbols_absent_required: true
  checker_aggregate_stage_collectors_forbidden: true
  metadata_based_capability_isolation_forbidden: true
  self_attestation_only_hard_requirement_allowed: false
  caller_metadata_may_grant_gate_authority: false
  caller_metadata_may_be_used_only_as_deny_signal: false
  actual_facts_source: FINAL_VISIBLE_CONTENT_PLUS_MACHINE_DERIVED_EVENTS_AND_VERIFIED_SEMANTIC_EVIDENCE
  author_sidecar_may_override_actual_facts: false
  bare_event_releases_may_not_create_hard_fact: true
  release_claim_visible_span_binding_required: true
  verified_first_release_required_for_hard_causality: true
  answer_bearing_full_show_forbidden: true
  first_full_exposure_must_be_resource_reveal: true
  semantic_unknown_policy: BLOCKING_FAIL_CLOSED
  durable_state_trace_required: true
  source_identity_is_machine_verified: true
  source_visual_review_is_independent_human_evidence_machine_bound: true
  formal_source_must_be_repository_materialized_before_SOURCE_LOCKED: true
  complete_machine_and_semantic_input_binding_required: true
  executable_machine_requirement_registry_required: true
  post_freeze_human_acceptance_receipt_required: true
  phase_b_required_before_fresh_validation: true
  phase_b_repository_local_activation_forbidden: true
  phase_b_controller_required_for_calibrated_claim: true
  semantic_judge_role_fields_are_not_producer_provenance: true
  semantic_judge_producer_provenance_required_for_calibrated_claim: true
  delivery_accepted_mode_requires_phase_b_qualification: false
  delivery_accepted_mode_state: AVAILABLE_WITH_PRODUCT_SPECIFIC_EVIDENCE
  pdf_downstream_blocked_before_independent_content_pass: true

enforcement_classes:
- MACHINE_DETERMINISTIC
- SEMANTIC_JUDGE
- HUMAN_ONLY
- AUTHOR_SELF_CHECK

enforcement_class_policy:
  MACHINE_DETERMINISTIC: exact structure, event coverage, state transition, digest, path, set, arithmetic, order and identity
  SEMANTIC_JUDGE: open semantic judgments requiring evidence-bound model or equivalent semantic review
  HUMAN_ONLY: source visual inspection, overall teaching quality, naturalness, professional judgment and final score
  AUTHOR_SELF_CHECK: non-authoritative risk signal only
  author_self_check_can_unlock_gate: false
  semantic_judge_can_return_unknown: true
  blocking_unknown_can_unlock_gate: false

executable_enforcement_registry:
  implementation: tools/teaching_demo_content_enforcement.py
  canonical_machine_gate_receipt_generator: tools/teaching_demo_content_enforcement.py#make_machine_gate_receipt
  every_MACHINE_DETERMINISTIC_HARD_requirement_must_have_code_spec: true
  code_spec_requires: [validator_id, failure_code, probe_id, stage, runner]
  runner_kinds: [local, core, checker]
  local_runner_must_resolve_to_callable: true
  contract_failure_code_must_equal_code_spec_failure_code: true
  missing_or_orphan_code_spec_is_architecture_failure: true
  machine_gate_requirement_coverage: MACHINE_DETERMINISTIC_HARD_with_stage_at_or_before_MACHINE_GATED
  machine_gate_requirement_item_requires: [requirement_id, verdict, validator_id, failure_code, probe_id, runner]
  duplicate_machine_gate_requirement_id_forbidden: true
  machine_gate_binds_enforcement_registry_digest: true
  machine_gate_binds_state_trace_prefix_digest: true
  author_may_not_invent_machine_requirement_PASS_without_current_code_spec: true

