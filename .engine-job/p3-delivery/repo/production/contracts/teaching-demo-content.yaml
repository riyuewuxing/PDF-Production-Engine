- answer_bearing_resource_missing_student_response
- answer_bearing_resource_revealed_before_student_response
- answer_bearing_RESOURCE_SHOW_FULL_used_for_discovery_or_scaffold
- answer_resource_visibility_state_missing
- answer_resource_first_full_exposure_not_explicit_reveal
- answer_resource_revealed_before_verified_formation
- actual_board_add_not_strictly_after_verified_formation
- practice_scope_occurrence_or_text_binding_drift
- formula_oralization_missing
- timing_arithmetic_not_recomputable
- state_transition_trace_missing_invalid_or_unresolved
- executable_machine_requirement_mapping_missing
- machine_gate_receipt_generator_validator_contract_drift
- semantic_judge_evidence_missing
- semantic_judge_producer_provenance_missing_before_accepted_mode
- blocking_semantic_unknown
- gate_evidence_stale
- submission_freeze_binding_stale
- human_acceptance_receipt_missing_or_stale
- internal_aggregate_acceptance_capability_present
- metadata_based_capability_isolation_attempt
- repository_local_gate_b_self_activation_attempt

review_and_unlock:
  engineer_score_meaning: submission_readiness_estimate_only
  engineer_score_can_unlock_downstream: false
  author_pass_can_unlock_downstream: false
  machine_pass_alone_can_unlock_downstream: false
  semantic_pass_without_human_can_unlock_downstream: false
  independent_content_human_review_required: true
  independent_pass_threshold: 92
  independent_every_dimension_minimum_required: true
  independent_hard_fail_count_required: 0
  independent_review_must_bind_exact_frozen_bytes: true
  HUMAN_ACCEPTANCE_RECEIPT_required_after_independent_PASS: true
  only_current_HUMAN_ACCEPTANCE_RECEIPT_may_release_content_to_downstream: true
  phase_a_accepted_mode_globally_locked: true
  repository_local_gate_b_activation_can_unlock: false
  phase_b_controller_and_independent_gate_b_required_before_accepted_mode_can_exist: true

two_topic_process_validation:
  required_before_process_declared_calibrated: true
  topics: 2
  selection: random_from_frozen_eligible_pool
  first_complete_submission_counts: true
  difficulty_based_replacement_forbidden: true
  both_must_independently_pass: true
