protected_operations:
  architecture_decision: architecture/adr/ADR-016-teaching-demo-protected-capability-consumer-closure.md
  contract: production/contracts/teacher-trial-two-pdf-v1.yaml
  operations:
    TEACHING_DEMO_CONTENT_ACCEPT:
      contract_key: content_accept
      canonical_entry: check_teaching_demo_content.py
      implementation_libraries:
        - _teaching_demo_content_core.inc
        - teaching_demo_content_architecture.py
        - _teaching_demo_content_architecture_impl.py
        - teaching_demo_content_enforcement.py
      forbidden_library_complete_symbols: [validate, validate_case, main]
      forbid_library_cli: true
      forbidden_paths: []
    TEACHING_DEMO_ARTIFACT_PLAN_WRITE:
      contract_key: artifact_plan_write
      canonical_entry: plan_teaching_demo_artifact_job.py
      implementation_libraries:
        - teaching_demo_artifact_plan_primitives.py
      forbidden_library_complete_symbols: [build_plan, write_content_addressed_plan, main]
      forbid_library_cli: true
      forbidden_paths: [plan_teaching_demo_artifact_job_legacy.py]
      required_call_order:
        - function: build_plan
          before: validate_case
          requires_before: [_require_accepted_content]
        - function: write_content_addressed_plan
          before: write_snapshot
          requires_before: [build_plan]
    TEACHING_DEMO_ARTIFACT_INPUT_LOCK_CONSUME:
      contract_key: artifact_input_lock_consume
      canonical_entry: check_artifact_job.py
      implementation_libraries: [verify_teaching_demo_artifact_plan.py]
      forbidden_library_complete_symbols: [main]
      forbid_library_cli: true
      forbidden_paths: []
      required_call_order:
        - function: _validate_live
          before: _require_ledger_evidence
          requires_before: [_module_input_lock_verification_errors]
    TEACHING_DEMO_PRODUCT_PDF_COMPOSE:
      contract_key: product_pdf_compose
      canonical_entry: build_current_run.py
      implementation_libraries: [publisher_core.py, publisher_core_legacy.py]
      forbidden_library_complete_symbols: [main, build, build_product]
      forbid_library_cli: true
      forbidden_paths: []
      required_call_order:
        - function: build_product
          before: clean_outputs
          requires_before: [validate_teaching_demo_inputs]
    TEACHING_DEMO_FORMAL_RENDER:
      contract_key: formal_render
      canonical_entry: render_current_run.py
      implementation_libraries: []
      forbidden_library_complete_symbols: [main, render_product]
      forbid_library_cli: true
      forbidden_paths: []
      required_call_order:
        - function: render_product
          before: rmtree
          requires_before: [validate_teaching_demo_inputs]
        - function: render_product
          before: mkdir
          requires_before: [validate_teaching_demo_inputs]
        - function: render_product
          before: render_pdf
          requires_before: [validate_teaching_demo_inputs]
        - function: render_product
          before: write_text
          requires_before: [validate_teaching_demo_inputs]

phase_b_evaluation:
  architecture_decision: architecture/adr/ADR-017-teaching-demo-phase-b-semantic-controller-provenance.md
